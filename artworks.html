<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>artworks — tarık yiğit</title>
<link rel="stylesheet" href="style.css"/>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
/* ── GALLERY GRID — large images, generous whitespace ── */
.gallery-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 24px;
  max-width: 960px;
  margin: 0 auto;
}

.gallery-item {
  cursor: pointer;
  position: relative;
}

.gallery-item-img {
  width: 100%;
  aspect-ratio: 1;
  background: #f5f5f5;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.gallery-item-img img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  transition: opacity 0.3s;
}
.gallery-item:hover .gallery-item-img img {
  opacity: 0.88;
}

/* placeholder */
.gallery-item-ph {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 6px;
}
.gallery-item-ph span {
  font-size: 9px; letter-spacing: 0.12em;
  text-transform: lowercase; color: var(--dim);
}

/* caption below image — very minimal */
.gallery-item-info {
  padding: 10px 0 0;
}
.gallery-item-title {
  font-size: 12px;
  color: var(--ink);
  text-transform: lowercase;
  margin-bottom: 2px;
  transition: color 0.2s;
}
.gallery-item:hover .gallery-item-title { color: var(--mid); }
.gallery-item-meta {
  font-size: 10px;
  color: var(--dim);
  letter-spacing: 0.04em;
  text-transform: lowercase;
}

.gallery-empty {
  grid-column: 1 / -1;
  text-align: center;
  padding: 60px 0;
  color: var(--dim);
  font-size: 12px;
}

/* ── Project cards — refined minimal ── */
.project-card {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 16px;
  align-items: start;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: padding-left 0.2s;
}
.project-card:first-child { border-top: 1px solid var(--line); }
.project-card:hover { padding-left: 8px; }

.project-thumb {
  width: 100px; height: 75px;
  background: #f5f5f5; overflow: hidden;
}
.project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.project-thumb-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--dim); text-transform: lowercase;
}
.project-name {
  font-size: 14px; font-weight: 400; margin-bottom: 4px;
  text-transform: lowercase; transition: color 0.2s;
}
.project-card:hover .project-name { color: var(--mid); }
.project-desc { font-size: 12px; color: var(--mid); }
.p-tag {
  font-size: 9px; letter-spacing: 0.08em; text-transform: lowercase;
  padding: 3px 10px; border: 1px solid; white-space: nowrap;
  align-self: start;
}
.tag-on { color: var(--ink); border-color: var(--ink); }
.tag-pl { color: var(--dim); border-color: var(--dim); }

@media (max-width: 640px) {
  .gallery-grid { grid-template-columns: 1fr; gap: 20px; }
  .project-card { grid-template-columns: 1fr auto; }
  .project-thumb { display: none; }
}
</style>
</head>
<body>
<div id="page-transition-mask"></div>
<header>
  <div class="header-left">
    <a href="index.html" class="header-name">tarık yiğit</a>
    <a href="https://instagram.com/veretrir" target="_blank" rel="noopener" class="ig-btn" data-no-transition>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </div>
  <nav>
    <a href="artworks.html" class="active" data-en="artworks" data-tr="eserler">artworks</a>
    <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
    <a href="about.html" data-en="about" data-tr="hakkında">about</a>
    <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
  </nav>
  <div class="header-right">
    <button class="lb on" id="b-en" onclick="setLang('en')">en</button>
    <span class="lang-sep">·</span>
    <button class="lb" id="b-tr" onclick="setLang('tr')">tr</button>
  </div>
</header>

<div class="page-wrap">
  <div class="sec" style="max-width:1000px;">
    <div class="sec-title" data-en="artworks" data-tr="eserler">artworks</div>

    <div class="tabs">
      <button class="tab-btn on" id="tab-works" onclick="swTab('works')" data-en="works" data-tr="eserler">works</button>
      <button class="tab-btn" id="tab-projects" onclick="swTab('projects')" data-en="ongoing &amp; planned" data-tr="devam &amp; planlanan">ongoing &amp; planned</button>
    </div>

    <div class="tab-panel on" id="panel-works">
      <div class="gallery-grid" id="artworkGrid"></div>
    </div>

    <div class="tab-panel" id="panel-projects">
      <div id="projectsList"></div>
    </div>
  </div>
</div>

<footer><span>tarık yiğit</span><span>veretrir.art</span></footer>

<div id="reading-overlay">
  <div class="reading-topbar">
    <span class="reading-badge" id="reading-badge"></span>
    <span class="reading-top-title" id="reading-top-title"></span>
  </div>
  <div class="reading-body" id="reading-body"></div>
</div>
<button id="back-fab" onclick="closeReading()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  <span data-en="back" data-tr="geri">back</span>
</button>

<div id="viewer-overlay">
  <div class="viewer-topbar">
    <span class="viewer-title" id="viewer-title-el"></span>
    <button class="viewer-close" onclick="closeViewer()" data-en="close" data-tr="kapat">close</button>
  </div>
  <model-viewer id="model-viewer-el" camera-controls auto-rotate autoplay shadow-intensity="1" exposure="0.85"
    style="background:#000;width:100%;height:100%;flex:1;"></model-viewer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
function swTab(t) {
  ['works','projects'].forEach(id => {
    document.getElementById('tab-'+id).classList.toggle('on', id===t);
    document.getElementById('panel-'+id).classList.toggle('on', id===t);
  });
}

function buildPage() {
  const l = currentLang;
  const grid = document.getElementById('artworkGrid');
  grid.innerHTML = '';

  SITE.artworks.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
    const displaySrc = _getDisplayImage(aw) || _mainImg(aw);

    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.addEventListener('click', () => openArtwork(idx));

    div.innerHTML = `
      <div class="gallery-item-img">
        ${displaySrc
          ? `<img src="${displaySrc}" alt="${_esc(title)}">`
          : `<div class="gallery-item-ph"><span>—</span></div>`}
      </div>
      <div class="gallery-item-info">
        <div class="gallery-item-title">${_esc(title)}</div>
        <div class="gallery-item-meta">${aw.year || ''}${medium ? ' · ' + _esc(medium) : ''}</div>
      </div>`;

    grid.appendChild(div);
  });

  if (!SITE.artworks.length) {
    grid.innerHTML = '<div class="gallery-empty">—</div>';
  }

  // Projects
  const pl = document.getElementById('projectsList');
  pl.innerHTML = '';
  SITE.projects.forEach((p, idx) => {
    const name = l === 'tr' ? (p.titleTR || p.title) : p.title;
    const desc = l === 'tr' ? (p.descTR || p.desc) : p.desc;
    const status = p.status === 'ongoing' ? (l === 'tr' ? 'devam ediyor' : 'ongoing') : (l === 'tr' ? 'planlandı' : 'planned');
    const displaySrc = _getDisplayImage(p);

    const div = document.createElement('div');
    div.className = 'project-card';
    div.addEventListener('click', () => openProject(idx));
    div.innerHTML = `
      <div class="project-thumb">${displaySrc ? `<img src="${displaySrc}" alt="${_esc(name)}">` : `<div class="project-thumb-ph">—</div>`}</div>
      <div>
        <div class="project-name">${_esc(name)}</div>
        <div class="project-desc">${_esc(desc || '')}</div>
      </div>
      <span class="p-tag ${p.status === 'ongoing' ? 'tag-on' : 'tag-pl'}">${status}</span>`;
    pl.appendChild(div);
  });
}

const _base = window.setLang;
window.setLang = function(l) { _base(l); buildPage(); };
document.addEventListener('DOMContentLoaded', () => { buildPage(); });
</script>
</body>
</html>
