<style>
/* ══════════════════════════════════════════════════════════════
   CONSISTENT LEFT-CENTER LAYOUT — matches homepage exactly
══════════════════════════════════════════════════════════════ */
html, body { height: 100%; margin: 0; }

.page-layout {
display: grid;
grid-template-columns: 280px 1fr;
min-height: 100vh;
}

/* Left panel — vertically centered, same as homepage */
.page-left {
display: flex;
flex-direction: column;
justify-content: center;
align-items: flex-start;
padding: 0 40px;
position: sticky;
top: 0;
height: 100vh;
}
.page-name {
font-size: 15px;
font-weight: 400;
letter-spacing: 0.04em;
text-transform: lowercase;
margin-bottom: 24px;
line-height: 1.4;
text-decoration: none;
color: var(–ink);
}
.page-nav { display: flex; flex-direction: column; gap: 6px; }
.page-nav a {
font-size: 11px;
letter-spacing: 0.05em;
text-transform: lowercase;
color: var(–mid);
text-decoration: none;
transition: color 0.2s;
}
.page-nav a:hover, .page-nav a.active { color: var(–ink); }
.page-lang {
margin-top: 20px;
display: flex; gap: 6px; align-items: center;
}
.page-ig {
margin-top: 16px;
}
.page-ig a {
display: inline-flex; align-items: center;
text-decoration: none; color: var(–dim);
transition: color 0.2s;
}
.page-ig a:hover { color: var(–ink); }
.page-ig svg { width: 14px; height: 14px; }

/* Right panel — scrollable content */
.page-right {
padding: 60px 40px 80px;
overflow-y: auto;
}

/* ══════════════════════════════════════════════════════════════
CLASSIFICATION TABS — 2D / 3D
══════════════════════════════════════════════════════════════ */
.class-tabs {
display: flex;
gap: 16px;
margin-bottom: 32px;
}
.class-tab {
background: none;
border: 1px solid var(–line);
font-family: var(–font);
font-size: 10px;
letter-spacing: 0.08em;
text-transform: lowercase;
color: var(–mid);
padding: 8px 16px;
cursor: pointer;
transition: all 0.2s;
}
.class-tab:hover { border-color: var(–ink); color: var(–ink); }
.class-tab.on {
background: var(–ink);
border-color: var(–ink);
color: #fff;
}

/* ══════════════════════════════════════════════════════════════
MASONRY GRID — Pinterest-style
══════════════════════════════════════════════════════════════ */
.masonry-grid {
column-count: 3;
column-gap: 20px;
max-width: 1200px;
}

.masonry-item {
break-inside: avoid;
margin-bottom: 20px;
cursor: pointer;
position: relative;
}

.masonry-img {
width: 100%;
background: #f5f5f5;
overflow: hidden;
}

.masonry-img img {
width: 100%;
height: auto;
display: block;
transition: opacity 0.3s;
}
.masonry-item:hover .masonry-img img {
opacity: 0.88;
}

/* placeholder */
.masonry-ph {
width: 100%;
padding-bottom: 100%;
background: #f5f5f5;
display: flex;
align-items: center;
justify-content: center;
position: relative;
}
.masonry-ph span {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
font-size: 9px;
letter-spacing: 0.12em;
text-transform: lowercase;
color: var(–dim);
}

/* caption below image */
.masonry-info {
padding: 10px 0 0;
}
.masonry-title {
font-size: 12px;
color: var(–ink);
text-transform: lowercase;
margin-bottom: 2px;
transition: color 0.2s;
}
.masonry-item:hover .masonry-title { color: var(–mid); }
.masonry-meta {
font-size: 10px;
color: var(–dim);
letter-spacing: 0.04em;
text-transform: lowercase;
}

.masonry-empty {
text-align: center;
padding: 60px 0;
color: var(–dim);
font-size: 12px;
}

/* ── Project cards — refined minimal ── */
.projects-section {
margin-top: 40px;
}
.projects-title {
font-size: 11px;
letter-spacing: 0.15em;
text-transform: lowercase;
color: var(–mid);
margin-bottom: 20px;
font-weight: 400;
}
.project-card {
display: grid;
grid-template-columns: 100px 1fr auto;
gap: 16px;
align-items: start;
padding: 20px 0;
border-bottom: 1px solid var(–line);
cursor: pointer;
transition: padding-left 0.2s;
}
.project-card:first-child { border-top: 1px solid var(–line); }
.project-card:hover { padding-left: 8px; }

.project-thumb {
width: 100px; height: 75px;
background: #f5f5f5; overflow: hidden;
}
.project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.project-thumb-ph {
width: 100%; height: 100%;
display: flex; align-items: center; justify-content: center;
font-size: 9px; color: var(–dim); text-transform: lowercase;
}
.project-name {
font-size: 14px; font-weight: 400; margin-bottom: 4px;
text-transform: lowercase; transition: color 0.2s;
}
.project-card:hover .project-name { color: var(–mid); }
.project-desc { font-size: 12px; color: var(–mid); }
.p-tag {
font-size: 9px; letter-spacing: 0.08em; text-transform: lowercase;
padding: 3px 10px; border: 1px solid; white-space: nowrap;
align-self: start;
}
.tag-on { color: var(–ink); border-color: var(–ink); }
.tag-pl { color: var(–dim); border-color: var(–dim); }

/* ══════════════════════════════════════════════════════════════
RESPONSIVE
══════════════════════════════════════════════════════════════ */
@media (max-width: 1000px) {
.masonry-grid { column-count: 2; }
}
@media (max-width: 800px) {
.page-layout {
grid-template-columns: 1fr;
}
.page-left {
position: relative;
height: auto;
padding: 40px 20px 30px;
justify-content: flex-start;
}
.page-right {
padding: 20px 20px 60px;
}
.masonry-grid { column-count: 2; column-gap: 12px; }
.masonry-item { margin-bottom: 12px; }
}
@media (max-width: 500px) {
.masonry-grid { column-count: 1; }
.project-card { grid-template-columns: 1fr auto; }
.project-thumb { display: none; }
}
</style>

</head>

<script>
let currentFilter = 'all';

function filterClass(cls) {
  currentFilter = cls;
  ['all', '2d', '3d'].forEach(id => {
    document.getElementById('tab-' + id).classList.toggle('on', id === cls);
  });
  buildPage();
}

function buildPage() {
  const l = currentLang;
  const grid = document.getElementById('artworkGrid');
  grid.innerHTML = '';

  // Filter artworks by workType
  const filtered = SITE.artworks.filter(aw => {
    if (currentFilter === 'all') return true;
    return aw.workType === currentFilter;
  });

  filtered.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
    const displaySrc = _getDisplayImage(aw) || _mainImg(aw);
    
    // Find original index in SITE.artworks for correct opening
    const originalIdx = SITE.artworks.findIndex(a => a.id === aw.id);

    const div = document.createElement('div');
    div.className = 'masonry-item';
    div.addEventListener('click', () => openArtwork(originalIdx));

    div.innerHTML = `
      <div class="masonry-img">
        ${displaySrc
          ? `<img src="${displaySrc}" alt="${_esc(title)}">`
          : `<div class="masonry-ph"><span>—</span></div>`}
      </div>
      <div class="masonry-info">
        <div class="masonry-title">${_esc(title)}</div>
        <div class="masonry-meta">${aw.year || ''}${medium ? ' · ' + _esc(medium) : ''}</div>
      </div>`;

    grid.appendChild(div);
  });

  if (!filtered.length) {
    grid.innerHTML = '<div class="masonry-empty">—</div>';
  }

  // Projects
  const pl = document.getElementById('projectsList');
  pl.innerHTML = '';
  SITE.projects.forEach((p, idx) => {
    const name = l === 'tr' ? (p.titleTR || p.title) : p.title;
    const desc = l === 'tr' ? (p.descTR || p.desc) : p.desc;
    const status = p.status === 'ongoing' ? (l === 'tr' ? 'devam ediyor' : 'ongoing') : (l === 'tr' ? 'planlandı' : 'planned');
    const displaySrc = _getDisplayImage(p);

    const div = document.createElement('div');
    div.className = 'project-card';
    div.addEventListener('click', () => openProject(idx));
    div.innerHTML = `
      <div class="project-thumb">${displaySrc ? `<img src="${displaySrc}" alt="${_esc(name)}">` : `<div class="project-thumb-ph">—</div>`}</div>
      <div>
        <div class="project-name">${_esc(name)}</div>
        <div class="project-desc">${_esc(desc || '')}</div>
      </div>
      <span class="p-tag ${p.status === 'ongoing' ? 'tag-on' : 'tag-pl'}">${status}</span>`;
    pl.appendChild(div);
  });
}

const _base = window.setLang;
window.setLang = function(l) { _base(l); buildPage(); };
document.addEventListener('DOMContentLoaded', () => { buildPage(); });
</script>
