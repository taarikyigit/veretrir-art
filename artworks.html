<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>artworks — tarık yiğit</title>
<link rel="stylesheet" href="style.css"/>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
/* ══════════════════════════════════════════════════════════════
   ARTWORKS LAYOUT - Sidebar + Grid
══════════════════════════════════════════════════════════════ */
.artworks-layout {
  display: grid;
  grid-template-columns: 160px 1fr;
  gap: 30px;
  min-height: calc(100vh - 120px);
}

/* Left Sidebar */
.artworks-sidebar {
  position: sticky;
  top: 80px;
  align-self: start;
  padding-right: 16px;
  border-right: 1px solid var(--line);
}

.sidebar-section {
  margin-bottom: 24px;
}

.sidebar-label {
  font-size: 9px;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--dim);
  margin-bottom: 10px;
  font-weight: 400;
}

.sidebar-nav {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-link {
  background: none;
  border: none;
  font-family: var(--font);
  font-size: 11px;
  text-transform: lowercase;
  color: var(--mid);
  padding: 4px 0;
  cursor: pointer;
  text-align: left;
  transition: color 0.2s;
  letter-spacing: 0.02em;
}

.sidebar-link:hover {
  color: var(--ink);
}

.sidebar-link.on {
  color: var(--ink);
  font-weight: 500;
}

/* Search in sidebar */
.sidebar-search {
  margin-top: 20px;
  padding-top: 20px;
  border-top: 1px solid var(--line);
}

.search-input {
  width: 100%;
  padding: 8px 10px;
  border: 1px solid var(--line);
  background: transparent;
  font-family: var(--font);
  font-size: 11px;
  color: var(--ink);
  outline: none;
  transition: border-color 0.2s;
}

.search-input:focus {
  border-color: var(--ink);
}

.search-input::placeholder {
  color: var(--dim);
}

.search-clear {
  display: none;
  margin-top: 6px;
  background: none;
  border: none;
  font-size: 10px;
  color: var(--mid);
  cursor: pointer;
  padding: 0;
}

.search-clear:hover {
  color: var(--ink);
}

.search-info {
  font-size: 10px;
  color: var(--mid);
  margin-top: 8px;
  line-height: 1.4;
}

/* Main content area */
.artworks-main {
  padding-top: 0;
}

/* Series Header */
.series-header {
  margin-bottom: 32px;
  padding-bottom: 24px;
  border-bottom: 1px solid var(--line);
}

.series-title {
  font-family: var(--font);
  font-size: 24px;
  font-weight: 400;
  font-style: italic;
  color: var(--ink);
  margin: 0 0 12px 0;
  text-transform: lowercase;
}

.series-desc {
  font-size: 13px;
  line-height: 1.7;
  color: var(--mid);
  margin: 0 0 12px 0;
  max-width: 600px;
}

.series-count {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--dim);
}

/* ══════════════════════════════════════════════════════════════
   MASONRY GRID — Pinterest-style, no cropping
══════════════════════════════════════════════════════════════ */
.masonry-grid {
  column-count: 3;
  column-gap: 20px;
  max-width: 1100px;
}

.masonry-item {
  break-inside: avoid;
  margin-bottom: 20px;
  cursor: pointer;
  position: relative;
}

.masonry-img {
  position: relative;
  width: 100%;
  background: #f5f5f5;
  overflow: hidden;
}

.masonry-img img {
  width: 100%;
  height: auto;
  display: block;
  transition: transform 0.3s ease;
}

/* Hover overlay */
.masonry-overlay {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 16px;
  opacity: 0;
  transition: opacity 0.25s ease;
}
.masonry-item:hover .masonry-overlay { opacity: 1; }
.masonry-item:hover .masonry-img img { transform: scale(1.02); }

.masonry-overlay-title {
  font-size: 13px;
  color: #fff;
  text-transform: lowercase;
  margin-bottom: 4px;
  font-weight: 400;
}
.masonry-overlay-meta {
  font-size: 10px;
  color: rgba(255,255,255,0.75);
  text-transform: lowercase;
  letter-spacing: 0.04em;
}

/* placeholder */
.masonry-ph {
  width: 100%;
  padding-bottom: 100%;
  background: #f5f5f5;
  position: relative;
}
.masonry-ph span {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: lowercase;
  color: var(--dim);
}

.masonry-empty {
  text-align: center;
  padding: 60px 0;
  color: var(--dim);
  font-size: 12px;
}

/* ══════════════════════════════════════════════════════════════
   PROJECTS SECTION — always at bottom
══════════════════════════════════════════════════════════════ */
.projects-section {
  margin-top: 60px;
  padding-top: 40px;
  border-top: 1px solid var(--line);
}
.projects-section-title {
  font-size: 11px;
  letter-spacing: 0.15em;
  text-transform: lowercase;
  color: var(--mid);
  margin-bottom: 24px;
  font-weight: 400;
}

.project-card {
  display: grid;
  grid-template-columns: 100px 1fr auto;
  gap: 16px;
  align-items: start;
  padding: 20px 0;
  border-bottom: 1px solid var(--line);
  cursor: pointer;
  transition: padding-left 0.2s;
}
.project-card:first-child { border-top: 1px solid var(--line); }
.project-card:hover { padding-left: 8px; }

.project-thumb {
  width: 100px; height: 75px;
  background: #f5f5f5; overflow: hidden;
  position: relative;
}
.project-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.project-thumb-ph {
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; color: var(--dim); text-transform: lowercase;
}
.project-name {
  font-size: 14px; font-weight: 400; margin-bottom: 4px;
  text-transform: lowercase; transition: color 0.2s;
}
.project-card:hover .project-name { color: var(--mid); }
.project-desc { font-size: 12px; color: var(--mid); }
.p-tag {
  font-size: 9px; letter-spacing: 0.08em; text-transform: lowercase;
  padding: 3px 10px; border: 1px solid; white-space: nowrap;
  align-self: start;
}
.tag-on { color: var(--ink); border-color: var(--ink); }
.tag-pl { color: var(--dim); border-color: var(--dim); }

/* ══════════════════════════════════════════════════════════════
   RESPONSIVE
══════════════════════════════════════════════════════════════ */
@media (max-width: 1000px) {
  .masonry-grid { column-count: 2; }
}

@media (max-width: 768px) {
  .artworks-layout {
    grid-template-columns: 1fr;
    gap: 24px;
  }
  
  .artworks-sidebar {
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--line);
    padding-right: 0;
    padding-bottom: 20px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
  }
  
  .sidebar-section {
    margin-bottom: 0;
  }
  
  .sidebar-nav {
    flex-direction: row;
    flex-wrap: wrap;
    gap: 6px 12px;
  }
  
  .sidebar-search {
    width: 100%;
    margin-top: 12px;
    padding-top: 12px;
  }
}

@media (max-width: 500px) {
  .masonry-grid { column-count: 1; }
  .project-card { grid-template-columns: 1fr auto; }
  .project-thumb { display: none; }
}
</style>
</head>
<body>
<div id="page-transition-mask"></div>
<header>
  <div class="header-left">
    <a href="index.html" class="header-name">tarık yiğit</a>
    <a href="https://instagram.com/veretrir" target="_blank" rel="noopener" class="ig-btn" data-no-transition>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </div>
  <nav>
    <a href="artworks.html" class="active" data-en="artworks" data-tr="eserler">artworks</a>
    <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
    <a href="about.html" data-en="about" data-tr="hakkında">about</a>
    <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
  </nav>
  <div class="header-right">
    <button class="lb on" id="b-en" onclick="setLang('en')">en</button>
    <span class="lang-sep">·</span>
    <button class="lb" id="b-tr" onclick="setLang('tr')">tr</button>
  </div>
</header>

<div class="page-wrap" style="padding-left:0;">
  <div class="sec" style="max-width:1400px;padding-top:20px;padding-left:var(--page-pad);padding-right:var(--page-pad);">
    
    <div class="artworks-layout">
      <!-- Left Sidebar -->
      <aside class="artworks-sidebar">
        <div class="sidebar-section" id="categorySection">
          <div class="sidebar-label" data-en="categories" data-tr="kategoriler">categories</div>
          <div class="sidebar-nav" id="categoryNav"></div>
        </div>
        
        <div class="sidebar-section" id="seriesSection" style="display:none;">
          <div class="sidebar-label" data-en="series" data-tr="seriler">series</div>
          <div class="sidebar-nav" id="seriesNav"></div>
        </div>
        
        <div class="sidebar-search">
          <input type="text" id="searchInput" class="search-input" placeholder="search..." data-placeholder-en="search..." data-placeholder-tr="ara...">
          <button class="search-clear" id="searchClear" onclick="clearSearch()">✕ clear</button>
          <div class="search-info" id="searchInfo" style="display:none;"></div>
        </div>
      </aside>
      
      <!-- Main Content -->
      <main class="artworks-main">
        <!-- Series Header (shown when viewing a series) -->
        <div class="series-header" id="seriesHeader" style="display:none;">
          <h2 class="series-title" id="seriesTitle"></h2>
          <p class="series-desc" id="seriesDesc"></p>
          <div class="series-count" id="seriesCount"></div>
        </div>
        
        <div class="masonry-grid" id="artworkGrid"></div>
        
        <!-- Projects section — only shown in 'all' view -->
        <div class="projects-section reveal" id="projectsSection">
          <div class="projects-section-title" data-en="ongoing & planned projects" data-tr="devam eden & planlanan projeler">ongoing & planned projects</div>
          <div id="projectsList"></div>
        </div>
      </main>
    </div>
    
  </div>
</div>

<footer><span>tarık yiğit</span><span>veretrir.art</span></footer>

<!-- Reading overlay -->
<div id="reading-overlay">
  <div class="reading-topbar">
    <span class="reading-badge" id="reading-badge"></span>
    <span class="reading-top-title" id="reading-top-title"></span>
  </div>

</div>
<button id="back-fab" onclick="closeReading()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  <span data-en="back" data-tr="geri">back</span>
</button>

<!-- 3D viewer -->
<div id="viewer-overlay">
  <div class="viewer-topbar">
    <span class="viewer-title" id="viewer-title-el"></span>
    <button class="viewer-close" onclick="closeViewer()" data-en="close" data-tr="kapat">close</button>
  </div>
  <model-viewer id="model-viewer-el" camera-controls auto-rotate autoplay shadow-intensity="1" exposure="0.85"
    style="background:#000;width:100%;height:100%;flex:1;"></model-viewer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
let currentCategory = 'all';
let searchQuery = '';

// Search functionality
function initSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  
  if (!input) return;
  
  // Update placeholder based on language
  function updatePlaceholder() {
    const ph = currentLang === 'tr' ? 'ara...' : 'search...';
    input.placeholder = ph;
  }
  updatePlaceholder();
  
  // Debounced search
  let searchTimeout;
  input.addEventListener('input', () => {
    clearTimeout(searchTimeout);
    searchTimeout = setTimeout(() => {
      searchQuery = input.value.trim().toLowerCase();
      clearBtn.style.display = searchQuery ? 'block' : 'none';
      buildPage();
    }, 200);
  });
  
  // Clear on Escape
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      clearSearch();
    }
  });
  
  // Update placeholder on language change
  const origSetLang = window.setLang;
  window.setLang = function(l) {
    origSetLang(l);
    updatePlaceholder();
  };
}

function clearSearch() {
  const input = document.getElementById('searchInput');
  const clearBtn = document.getElementById('searchClear');
  if (input) input.value = '';
  if (clearBtn) clearBtn.style.display = 'none';
  searchQuery = '';
  buildPage();
}

function matchesSearch(aw, query) {
  if (!query) return true;
  
  const l = currentLang;
  const title = (l === 'tr' ? (aw.titleTR || aw.title) : aw.title) || '';
  const desc = (l === 'tr' ? (aw.descTR || aw.desc) : aw.desc) || '';
  const medium = (l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium) || '';
  const year = aw.year || '';
  const category = aw.category || '';
  const series = aw.series || '';
  
  const searchText = `${title} ${desc} ${medium} ${year} ${category} ${series}`.toLowerCase();
  
  // Support multiple words (AND search)
  const words = query.split(/\s+/).filter(w => w.length > 0);
  return words.every(word => searchText.includes(word));
}

function buildCategoryNav() {
  const l = currentLang;
  const catNav = document.getElementById('categoryNav');
  const serNav = document.getElementById('seriesNav');
  const serSection = document.getElementById('seriesSection');
  
  catNav.innerHTML = '';
  serNav.innerHTML = '';

  // Collect unique categories from artworks
  const usedCategories = new Set();
  const usedSeries = new Set();
  SITE.artworks.forEach(aw => {
    if (aw.category && aw.category.trim()) {
      usedCategories.add(aw.category.trim().toLowerCase());
    }
    if (aw.series && aw.series.trim()) {
      usedSeries.add(aw.series.trim().toLowerCase());
    }
  });

  // Get definitions for translation
  const categoryDefs = SITE.categories || [];
  const seriesDefs = SITE.series || [];
  
  function getCategoryLabel(catKey) {
    const def = categoryDefs.find(c => c.en === catKey);
    if (def) return l === 'tr' ? def.tr : def.en;
    return catKey;
  }
  
  function getSeriesLabel(serKey) {
    const def = seriesDefs.find(s => s.en === serKey);
    if (def) return l === 'tr' ? def.tr : def.en;
    return serKey;
  }

  // Sort
  const sortedCats = Array.from(usedCategories).sort((a, b) => a.localeCompare(b));
  const sortedSeries = Array.from(usedSeries).sort((a, b) => a.localeCompare(b));

  // Add "All" link
  const allLink = document.createElement('button');
  allLink.className = 'sidebar-link' + (currentCategory === 'all' ? ' on' : '');
  allLink.textContent = l === 'tr' ? 'tümü' : 'all';
  allLink.addEventListener('click', () => { currentCategory = 'all'; buildPage(); });
  catNav.appendChild(allLink);

  // Add category links
  sortedCats.forEach(cat => {
    const link = document.createElement('button');
    link.className = 'sidebar-link' + (currentCategory === 'cat:' + cat ? ' on' : '');
    link.textContent = getCategoryLabel(cat);
    link.addEventListener('click', () => { currentCategory = 'cat:' + cat; buildPage(); });
    catNav.appendChild(link);
  });

  // Add "ongoing & planned" category if there are projects
  if (SITE.projects && SITE.projects.length > 0) {
    const projLink = document.createElement('button');
    projLink.className = 'sidebar-link' + (currentCategory === 'projects' ? ' on' : '');
    projLink.textContent = l === 'tr' ? 'devam eden & planlanan' : 'ongoing & planned';
    projLink.addEventListener('click', () => { currentCategory = 'projects'; buildPage(); });
    catNav.appendChild(projLink);
  }

  // Add series links (if any)
  if (sortedSeries.length > 0) {
    serSection.style.display = '';
    
    sortedSeries.forEach(ser => {
      const link = document.createElement('button');
      link.className = 'sidebar-link' + (currentCategory === 'ser:' + ser ? ' on' : '');
      link.textContent = getSeriesLabel(ser);
      link.addEventListener('click', () => { currentCategory = 'ser:' + ser; buildPage(); });
      serNav.appendChild(link);
    });
  } else {
    serSection.style.display = 'none';
  }
  
  // Update sidebar labels for language
  document.querySelectorAll('.sidebar-label').forEach(el => {
    if (el.dataset.en && el.dataset.tr) {
      el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
    }
  });
}

function updateSeriesHeader() {
  const l = currentLang;
  const header = document.getElementById('seriesHeader');
  const titleEl = document.getElementById('seriesTitle');
  const descEl = document.getElementById('seriesDesc');
  const countEl = document.getElementById('seriesCount');
  
  // Handle "projects" category
  if (currentCategory === 'projects') {
    const projectCount = (SITE.projects || []).length;
    titleEl.textContent = l === 'tr' ? 'devam eden & planlanan projeler' : 'ongoing & planned projects';
    descEl.textContent = '';
    descEl.style.display = 'none';
    countEl.textContent = l === 'tr' 
      ? `${projectCount} proje` 
      : `${projectCount} project${projectCount !== 1 ? 's' : ''}`;
    header.style.display = '';
    return;
  }
  
  if (!currentCategory.startsWith('ser:')) {
    header.style.display = 'none';
    return;
  }
  
  const serKey = currentCategory.slice(4).toLowerCase();
  const seriesDefs = SITE.series || [];
  const serDef = seriesDefs.find(s => s.en.toLowerCase() === serKey);
  
  if (!serDef) {
    header.style.display = 'none';
    return;
  }
  
  const seriesName = l === 'tr' ? (serDef.tr || serDef.en) : serDef.en;
  const seriesDesc = l === 'tr' ? (serDef.descTR || serDef.desc || '') : (serDef.desc || '');
  const artworkCount = SITE.artworks.filter(aw => 
    aw.series && aw.series.trim().toLowerCase() === serKey
  ).length;
  
  titleEl.textContent = seriesName;
  descEl.textContent = seriesDesc;
  descEl.style.display = seriesDesc ? '' : 'none';
  countEl.textContent = l === 'tr' 
    ? `${artworkCount} eser` 
    : `${artworkCount} work${artworkCount !== 1 ? 's' : ''}`;
  
  header.style.display = '';
}

function buildPage() {
  const l = currentLang;
  
  // Build category nav
  buildCategoryNav();
  
  // Update series header
  updateSeriesHeader();

  // Check if we're showing the "projects" category
  const showingProjects = currentCategory === 'projects';

  // Filter artworks (empty if showing projects only)
  let filtered = [];
  if (!showingProjects) {
    filtered = SITE.artworks;
    if (currentCategory !== 'all') {
      if (currentCategory.startsWith('cat:')) {
        const cat = currentCategory.slice(4).toLowerCase();
        filtered = SITE.artworks.filter(aw => 
          aw.category && aw.category.trim().toLowerCase() === cat
        );
      } else if (currentCategory.startsWith('ser:')) {
        const ser = currentCategory.slice(4).toLowerCase();
        // Case-insensitive comparison for series
        filtered = SITE.artworks.filter(aw => 
          aw.series && aw.series.trim().toLowerCase() === ser
        );
        console.log('Series filter:', ser, 'Matches:', filtered.map(a => a.title));
      } else {
        // Legacy support for old category format
        filtered = SITE.artworks.filter(aw => 
          aw.category && aw.category.trim().toLowerCase() === currentCategory
        );
      }
    }
  }

  // Apply search filter
  if (searchQuery && !showingProjects) {
    filtered = filtered.filter(aw => matchesSearch(aw, searchQuery));
  }

  // Update search info
  const searchInfo = document.getElementById('searchInfo');
  if (searchQuery && !showingProjects) {
    const totalInCategory = currentCategory === 'all' ? SITE.artworks.length : 
      SITE.artworks.filter(aw => {
        if (currentCategory.startsWith('cat:')) return aw.category && aw.category.trim().toLowerCase() === currentCategory.slice(4).toLowerCase();
        if (currentCategory.startsWith('ser:')) return aw.series && aw.series.trim() === currentCategory.slice(4);
        return true;
      }).length;
    
    const infoText = l === 'tr' 
      ? `"${searchQuery}" için ${filtered.length} sonuç bulundu`
      : `Found ${filtered.length} result${filtered.length !== 1 ? 's' : ''} for "${searchQuery}"`;
    searchInfo.innerHTML = infoText + (filtered.length < totalInCategory ? ` <a href="#" onclick="clearSearch();return false;" style="margin-left:8px;color:var(--ink);">${l === 'tr' ? 'temizle' : 'clear'}</a>` : '');
    searchInfo.style.display = 'block';
  } else {
    searchInfo.style.display = 'none';
  }

  // Debug: log filter results
  console.log('Filter:', currentCategory, 'Search:', searchQuery, 'Found:', filtered.length);

  // Build masonry grid (hide if showing projects only)
  const grid = document.getElementById('artworkGrid');
  grid.innerHTML = '';
  
  if (showingProjects) {
    grid.style.display = 'none';
  } else {
    grid.style.display = '';

    filtered.forEach((aw, idx) => {
      const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
      const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
      const displaySrc = _getDisplayImage(aw) || _mainImg(aw);
      
      // Find original index in SITE.artworks
      const originalIdx = SITE.artworks.findIndex(a => a.id === aw.id);

      const div = document.createElement('div');
      div.className = 'masonry-item img-zoom-hover';
      div.addEventListener('click', () => openArtwork(originalIdx));

      if (displaySrc) {
        div.innerHTML = `
          <div class="masonry-img">
            <img src="${displaySrc}" alt="${_esc(title)}">
            <div class="masonry-overlay">
              <div class="masonry-overlay-title">${_esc(title)}</div>
              <div class="masonry-overlay-meta">${medium ? _esc(medium) : ''}${medium && aw.year ? ' · ' : ''}${aw.year || ''}</div>
            </div>
          </div>`;
      } else {
        div.innerHTML = `<div class="masonry-ph"><span>—</span></div>`;
      }

      grid.appendChild(div);
    });

    if (!filtered.length) {
      grid.innerHTML = '<div class="masonry-empty">—</div>';
    }
  }

  // Build projects list - show when viewing "all" OR "projects" category
  const pl = document.getElementById('projectsList');
  pl.innerHTML = '';
  
  // Show/hide projects section
  const projectsSection = document.getElementById('projectsSection');
  const projectsTitle = projectsSection.querySelector('.projects-section-title');
  
  if ((currentCategory === 'all' || currentCategory === 'projects') && SITE.projects && SITE.projects.length) {
    projectsSection.style.display = '';
    
    // Hide title when it's the main view (projects category)
    if (currentCategory === 'projects') {
      projectsTitle.style.display = 'none';
      projectsSection.style.marginTop = '0';
      projectsSection.style.paddingTop = '0';
      projectsSection.style.borderTop = 'none';
    } else {
      projectsTitle.style.display = '';
      projectsSection.style.marginTop = '';
      projectsSection.style.paddingTop = '';
      projectsSection.style.borderTop = '';
    }
    
    SITE.projects.forEach((p, idx) => {
      const name = l === 'tr' ? (p.titleTR || p.title) : p.title;
      const desc = l === 'tr' ? (p.descTR || p.desc) : p.desc;
      const status = p.status === 'ongoing' 
        ? (l === 'tr' ? 'devam ediyor' : 'ongoing') 
        : (l === 'tr' ? 'planlandı' : 'planned');
      const displaySrc = _getDisplayImage(p);

      const div = document.createElement('div');
      div.className = 'project-card';
      div.addEventListener('click', () => openProject(idx));
      div.innerHTML = `
        <div class="project-thumb">
          ${displaySrc ? `<img src="${displaySrc}" alt="${_esc(name)}">` : `<div class="project-thumb-ph">—</div>`}
        </div>
        <div>
          <div class="project-name">${_esc(name)}</div>
          <div class="project-desc">${_esc(desc || '')}</div>
        </div>
        <span class="p-tag ${p.status === 'ongoing' ? 'tag-on' : 'tag-pl'}">${status}</span>`;
      pl.appendChild(div);
    });
  } else {
    projectsSection.style.display = 'none';
  }
}

const _base = window.setLang;
window.setLang = function(l) { _base(l); buildPage(); triggerReveals(); };
document.addEventListener('DOMContentLoaded', () => { 
  // Check URL hash for category/series filter
  let hash = decodeURIComponent(window.location.hash.slice(1));
  if (hash) {
    // Normalize: lowercase the value part for consistent matching
    if (hash.startsWith('ser:')) {
      hash = 'ser:' + hash.slice(4).toLowerCase();
    } else if (hash.startsWith('cat:')) {
      hash = 'cat:' + hash.slice(4).toLowerCase();
    }
    currentCategory = hash;
  }
  
  initSearch();
  buildPage(); 
  setTimeout(triggerReveals, 100);
});

// Handle hash changes
window.addEventListener('hashchange', () => {
  let hash = decodeURIComponent(window.location.hash.slice(1));
  if (hash) {
    // Normalize: lowercase the value part
    if (hash.startsWith('ser:')) {
      hash = 'ser:' + hash.slice(4).toLowerCase();
    } else if (hash.startsWith('cat:')) {
      hash = 'cat:' + hash.slice(4).toLowerCase();
    }
    currentCategory = hash;
    buildPage();
  }
});

function triggerReveals() {
  document.querySelectorAll('.reveal:not(.active)').forEach((el, i) => {
    const rect = el.getBoundingClientRect();
    if (rect.top < window.innerHeight - 50) {
      el.classList.add('active');
    }
  });
}
</script>
