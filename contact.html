<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>contact — tarık yiğit</title>
<link rel="stylesheet" href="style.css"/>
<style>
/* ══════════════════════════════════════════════════════════════
   CONSISTENT LEFT-CENTER LAYOUT — matches homepage exactly
══════════════════════════════════════════════════════════════ */
html, body { height: 100%; margin: 0; }

.page-layout {
display: grid;
grid-template-columns: 280px 1fr;
min-height: 100vh;
}

/* Left panel — vertically centered, same as homepage */
.page-left {
display: flex;
flex-direction: column;
justify-content: center;
align-items: flex-start;
padding: 0 40px;
position: sticky;
top: 0;
height: 100vh;
}
.page-name {
font-size: 15px;
font-weight: 400;
letter-spacing: 0.04em;
text-transform: lowercase;
margin-bottom: 24px;
line-height: 1.4;
text-decoration: none;
color: var(–ink);
}
.page-nav { display: flex; flex-direction: column; gap: 6px; }
.page-nav a {
font-size: 11px;
letter-spacing: 0.05em;
text-transform: lowercase;
color: var(–mid);
text-decoration: none;
transition: color 0.2s;
}
.page-nav a:hover, .page-nav a.active { color: var(–ink); }
.page-lang {
margin-top: 20px;
display: flex; gap: 6px; align-items: center;
}
.page-ig {
margin-top: 16px;
}
.page-ig a {
display: inline-flex; align-items: center;
text-decoration: none; color: var(–dim);
transition: color 0.2s;
}
.page-ig a:hover { color: var(–ink); }
.page-ig svg { width: 14px; height: 14px; }

/* Right panel — vertically centered content */
.page-right {
display: flex;
flex-direction: column;
justify-content: center;
align-items: flex-start;
padding: 60px 60px 80px;
min-height: 100vh;
}

.contact-email {
display: inline-block;
font-size: 16px;
font-weight: 400;
color: var(–ink);
text-decoration: none;
border-bottom: 1px solid var(–ink);
padding-bottom: 2px;
transition: color 0.2s, border-color 0.2s;
text-transform: lowercase;
}
.contact-email:hover { color: var(–mid); border-color: var(–mid); }
.contact-note {
margin-top: 16px;
font-size: 12px;
color: var(–dim);
text-transform: lowercase;
}

/* ══════════════════════════════════════════════════════════════
RESPONSIVE
══════════════════════════════════════════════════════════════ */
@media (max-width: 800px) {
.page-layout {
grid-template-columns: 1fr;
}
.page-left {
position: relative;
height: auto;
padding: 40px 20px 30px;
justify-content: flex-start;
}
.page-right {
padding: 40px 20px 60px;
justify-content: flex-start;
min-height: auto;
}
}
</style>

</head>
<body>
<div id="page-transition-mask"></div>

<div class="page-layout">
  <!-- LEFT: consistent nav — vertically centered like homepage -->
  <div class="page-left">
    <a href="index.html" class="page-name">tarık yiğit</a>
    <div class="page-nav">
      <a href="artworks.html" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
      <a href="about.html" data-en="about" data-tr="hakkında">about</a>
      <a href="contact.html" class="active" data-en="contact" data-tr="iletişim">contact</a>
    </div>
    <div class="page-lang">
      <button class="lb on" id="b-en" onclick="setLang('en')">en</button>
      <span class="lang-sep">·</span>
      <button class="lb" id="b-tr" onclick="setLang('tr')">tr</button>
    </div>
    <div class="page-ig">
      <a href="https://instagram.com/veretrir" target="_blank" rel="noopener" data-no-transition>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- RIGHT: content -->

  <div class="page-right">
    <a href="mailto:hello@veretrir.art" class="contact-email" data-no-transition>hello@veretrir.art</a>
    <p class="contact-note" id="contactNote"></p>
  </div>
</div>

<script src="data.js"></script>

<script src="common.js"></script>

<script>
document.addEventListener('DOMContentLoaded', () => {
  function renderNote() {
    const l = currentLang;
    const txt = (SITE.texts || {});
    const note = l === 'tr' ? (txt.contactNoteTR || txt.contactNote || '') : (txt.contactNote || 'collaborations, exhibitions, publications.');
    const el = document.getElementById('contactNote');
    if (el) el.textContent = note;
  }
  renderNote();
  document.getElementById('b-en').addEventListener('click', renderNote);
  document.getElementById('b-tr').addEventListener('click', renderNote);
});
</script>

</body>
</html>
