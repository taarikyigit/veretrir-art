<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>contact — tarık yiğit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="site-layout">
  <!-- Main Content -->
  <main class="site-content">
    <div class="contact-content">
      <div class="contact-email">
        <a href="mailto:hello@veretrir.art" id="contact-email">hello@veretrir.art</a>
      </div>
      <div class="contact-note" id="contact-note"></div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="site-sidebar">
    <div class="sidebar-name">
      <a href="index.html">tarık yiğit</a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="about.html" class="sidebar-link" data-en="about" data-tr="hakkında">about</a>
      <a href="writings.html" class="sidebar-link" data-en="writings" data-tr="yazılar">writings</a>
      <a href="contact.html" class="sidebar-link active" data-en="contact" data-tr="iletişim">contact</a>
    </nav>
    
    <div class="sidebar-spacer"></div>
    
    <div class="sidebar-lang">
      <button id="b-en" class="on">EN</button>
      <span>/</span>
      <button id="b-tr">TR</button>
    </div>
  </aside>
</div>

<script src="data.js"></script>
<script>
let currentLang = localStorage.getItem('lang') || 'tr';

function updateLang() {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = currentLang === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('b-en').classList.toggle('on', currentLang === 'en');
  document.getElementById('b-tr').classList.toggle('on', currentLang === 'tr');
  localStorage.setItem('lang', currentLang);
}

function buildContact() {
  const l = currentLang;
  const texts = SITE.texts || {};
  
  const note = l === 'tr' ? (texts.contactNoteTR || texts.contactNote || '') : (texts.contactNote || '');
  document.getElementById('contact-note').textContent = note;
}

document.addEventListener('DOMContentLoaded', () => {
  updateLang();
  buildContact();
  
  document.getElementById('b-en').addEventListener('click', () => {
    currentLang = 'en';
    updateLang();
    buildContact();
  });
  
  document.getElementById('b-tr').addEventListener('click', () => {
    currentLang = 'tr';
    updateLang();
    buildContact();
  });
});
</script>

</body>
</html>
