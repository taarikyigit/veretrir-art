<style>
/* ══════════════════════════════════════════════════════════════
   CONSISTENT LEFT-CENTER LAYOUT — matches homepage exactly
══════════════════════════════════════════════════════════════ */
html, body { height: 100%; margin: 0; }

.page-layout {
display: grid;
grid-template-columns: 280px 1fr;
min-height: 100vh;
}

/* Left panel — vertically centered, same as homepage */
.page-left {
display: flex;
flex-direction: column;
justify-content: center;
align-items: flex-start;
padding: 0 40px;
position: sticky;
top: 0;
height: 100vh;
}
.page-name {
font-size: 15px;
font-weight: 400;
letter-spacing: 0.04em;
text-transform: lowercase;
margin-bottom: 24px;
line-height: 1.4;
text-decoration: none;
color: var(–ink);
}
.page-nav { display: flex; flex-direction: column; gap: 6px; }
.page-nav a {
font-size: 11px;
letter-spacing: 0.05em;
text-transform: lowercase;
color: var(–mid);
text-decoration: none;
transition: color 0.2s;
}
.page-nav a:hover, .page-nav a.active { color: var(–ink); }
.page-lang {
margin-top: 20px;
display: flex; gap: 6px; align-items: center;
}
.page-ig {
margin-top: 16px;
}
.page-ig a {
display: inline-flex; align-items: center;
text-decoration: none; color: var(–dim);
transition: color 0.2s;
}
.page-ig a:hover { color: var(–ink); }
.page-ig svg { width: 14px; height: 14px; }

/* Right panel — scrollable content */
.page-right {
padding: 60px 40px 80px;
overflow-y: auto;
}

.writings-grid { display:grid; grid-template-columns:1fr 1fr; gap:52px; }
@media(max-width:640px){ .writings-grid{ grid-template-columns:1fr; gap:32px; } }

/* ── book list ── */
.book-item {
display:flex; align-items:center; gap:20px;
padding:18px 0; border-bottom:1px solid var(–line);
cursor:pointer; transition:padding-left .2s;
}
.book-item:hover { padding-left:8px; }
.book-cover-thumb {
width:48px; height:64px; flex-shrink:0;
background:#f5f5f5; overflow:hidden;
display:flex; align-items:center; justify-content:center;
}
.book-cover-thumb img { width:100%;height:100%;object-fit:cover; }
.book-cover-ph { font-size:8px;letter-spacing:.1em;text-transform:lowercase;color:var(–dim);font-family:var(–mono); }
.book-info-title { font-size:14px;color:var(–ink);margin-bottom:3px;transition:color .2s;text-transform:lowercase; }
.book-item:hover .book-info-title { color:var(–mid); }
.book-info-meta { font-size:10px;letter-spacing:.08em;text-transform:lowercase;color:var(–dim);font-family:var(–mono); }

/* ════════════════════════════════════════
BOOK READER OVERLAY
════════════════════════════════════════ */
#book-overlay {
position:fixed; inset:0; z-index:800;
background:#18160f;
display:flex; flex-direction:column;
transform:translateY(100%);
transition:transform .42s cubic-bezier(.4,0,.2,1);
pointer-events:none; visibility:hidden;
}
#book-overlay.open { transform:translateY(0); pointer-events:all; visibility:visible; }

/* ── toolbar ── */
.br-toolbar {
display:flex; align-items:center; justify-content:space-between;
flex-wrap:wrap; gap:8px;
padding:0 16px; height:52px; flex-shrink:0;
background:#111; border-bottom:1px solid #2a2a20;
font-family:var(–mono);
}
.br-title { font-size:13px;font-style:italic;color:#aaa;font-family:var(–font);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px; }

.br-tools { display:flex;align-items:center;gap:6px;flex-wrap:wrap; }

.br-btn {
background:none; border:1px solid #2e2e22; color:#888;
font-family:var(–mono); font-size:13px;
width:34px; height:34px;
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:border-color .15s,color .15s;
flex-shrink:0; padding:0;
}
.br-btn:hover:not(:disabled) { border-color:#aaa;color:#fff; }
.br-btn:disabled { opacity:.25;cursor:default; }

.br-page-input {
background:#1e1e16; border:1px solid #2e2e22; color:#ccc;
font-family:var(–mono); font-size:12px;
width:46px; height:34px; text-align:center;
outline:none; transition:border-color .15s;
}
.br-page-input:focus { border-color:#888; }
.br-page-total { font-size:11px;color:#555;white-space:nowrap; }

.br-zoom-val { font-size:11px;color:#666;min-width:36px;text-align:center; }

.br-sep { width:1px;height:22px;background:#2a2a20;margin:0 2px; }

.br-download-btn {
background:none; border:1px solid #2e2e22; color:#888;
font-family:var(–font); font-size:11px; letter-spacing:.06em;
padding:0 14px; height:34px;
cursor:pointer; transition:border-color .15s,color .15s;
white-space:nowrap;
}
.br-download-btn:hover { border-color:#aaa;color:#fff; }

.br-close-btn {
background:none; border:1px solid #2e2e22; color:#777;
font-family:var(–font); font-size:11px; letter-spacing:.06em;
padding:0 16px; height:34px;
cursor:pointer; transition:border-color .15s,color .15s;
}
.br-close-btn:hover { border-color:#fff;color:#fff; }

/* ── stage ── */
.br-stage {
flex:1; overflow:hidden;
display:flex; align-items:center; justify-content:center;
position:relative; user-select:none;
}

/* loading */
.br-loading {
position:absolute; inset:0;
display:flex; flex-direction:column; align-items:center; justify-content:center;
gap:14px; color:#555; font-style:italic;
}
.br-spinner {
width:26px;height:26px;
border:2px solid #2a2a20;border-top-color:#777;
border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── spread container ── */
#br-spread-wrap {
position:relative;
display:flex; align-items:center; justify-content:center;
}

/* two canvases side by side */
.br-page-canvas {
display:block;
background:#faf8f2;
box-shadow:4px 0 16px rgba(0,0,0,.5);
flex-shrink:0;
}
.br-page-canvas.left  { box-shadow: 4px 0 20px rgba(0,0,0,.55), inset -2px 0 6px rgba(0,0,0,.12); }
.br-page-canvas.right { box-shadow:-4px 0 20px rgba(0,0,0,.55), inset  2px 0 6px rgba(0,0,0,.12); }

/* flip canvas overlay */
#br-flip-canvas {
position:absolute;
top:0; left:0;
pointer-events:none;
display:none;
}

.br-spine {
width:8px; flex-shrink:0;
background:linear-gradient(to right,#b8b0a0,#ede8de 40%,#ede8de 60%,#b8b0a0);
box-shadow:inset -1px 0 3px rgba(0,0,0,.2), inset 1px 0 3px rgba(0,0,0,.2);
align-self:stretch;
}

/* ── bottom nav ── */
.br-bottom {
display:flex; align-items:center; justify-content:center; gap:16px;
padding:12px 16px; flex-shrink:0;
background:#111; border-top:1px solid #2a2a20;
}
.br-nav-btn {
background:none; border:1px solid #2e2e22; color:#888;
font-family:var(–mono); font-size:16px;
width:40px; height:40px;
display:flex; align-items:center; justify-content:center;
cursor:pointer; transition:border-color .15s,color .15s;
}
.br-nav-btn:hover:not(:disabled) { border-color:#ccc;color:#ccc; }
.br-nav-btn:disabled { opacity:.25;cursor:default; }
.br-progress-bar {
width:160px; height:3px; background:#222;
border-radius:2px; overflow:hidden; cursor:pointer;
}
.br-progress-fill { height:100%;background:#666;border-radius:2px;transition:width .2s; }

@media(max-width:800px){
.page-layout { grid-template-columns: 1fr; }
.page-left {
position: relative;
height: auto;
padding: 40px 20px 30px;
justify-content: flex-start;
}
.page-right { padding: 20px 20px 60px; }
}
@media(max-width:700px){
.br-title{max-width:100px;}
.br-zoom-val,.br-sep{display:none;}
}
</style>

</head>

<script>
function swTab(t){['all','books','poems','articles'].forEach(id=>{document.getElementById('tab-'+id).classList.toggle('on',id===t);document.getElementById('panel-'+id).classList.toggle('on',id===t);});}

function buildWritings(){
  const l=currentLang;
  function mkBookItem(b,idx){
    const t=l==='tr'?(b.titleTR||b.title):b.title;
    const d=document.createElement('div');d.className='book-item';
    d.innerHTML=`<div class="book-cover-thumb">${b.cover?`<img src="${b.cover}" alt="">`:`<span class="book-cover-ph">—</span>`}</div><div><div class="book-info-title">${_esc(t)}</div><div class="book-info-meta">${b.year||''}</div></div>`;
    d.addEventListener('click',()=>openBook(idx));return d;
  }
  function mkItem(o,type,idx){
    const t=l==='tr'?(o.titleTR||o.title):o.title;
    const d=document.createElement('div');d.className='writing-item';
    d.innerHTML=`<div class="wi-title">${_esc(t)}</div><div class="wi-meta">${o.year||''}${o.type?' · '+_esc(l==='tr'?(o.typeTR||o.type):o.type):''}</div>`;
    d.addEventListener('click',()=>type==='poem'?openPoem(idx):openArticle(idx));return d;
  }
  ['all-books','books-list'].forEach(id=>{const c=document.getElementById(id);if(c){c.innerHTML='';(SITE.books||[]).forEach((b,i)=>c.appendChild(mkBookItem(b,i)));}});
  ['all-poems','poems-list'].forEach(id=>{const c=document.getElementById(id);if(c){c.innerHTML='';(SITE.poems||[]).forEach((p,i)=>c.appendChild(mkItem(p,'poem',i)));}});
  ['all-articles','articles-list'].forEach(id=>{const c=document.getElementById(id);if(c){c.innerHTML='';(SITE.articles||[]).forEach((a,i)=>c.appendChild(mkItem(a,'article',i)));}});
}
const _setLangBase=window.setLang;window.setLang=function(l){_setLangBase(l);buildWritings();};
document.addEventListener('DOMContentLoaded',buildWritings);
</script>

<!-- Book Reader Logic -->

<script>
const BR={pdf:null,total:0,leftPage:1,zoom:1.0,baseW:0,baseH:0,animating:false};
const DPR=Math.min(window.devicePixelRatio||1,2);

async function openBook(idx){
  const b=SITE.books[idx];if(!b||!b.pdf)return;
  const o=document.getElementById('book-overlay');o.classList.add('open');
  document.getElementById('brLoading').style.display='flex';
  document.getElementById('br-spread-wrap').style.visibility='hidden';
  const l=currentLang;
  document.getElementById('brTitle').textContent=l==='tr'?(b.titleTR||b.title):b.title;
  const dl=document.getElementById('brDownload');
  if(b.allowDownload){dl.style.display='';dl.onclick=()=>window.open(b.pdf,'_blank');}else{dl.style.display='none';}
  try{
    BR.pdf=await pdfjsLib.getDocument(b.pdf).promise;
    BR.total=BR.pdf.numPages;BR.leftPage=1;BR.zoom=1.0;
    document.getElementById('brPageTotal').textContent='/ '+BR.total;
    brCalcFit();brRender();
    document.getElementById('brLoading').style.display='none';
    document.getElementById('br-spread-wrap').style.visibility='visible';
  }catch(e){console.error('PDF load error',e);closeBook();}
}

function closeBook(){
  document.getElementById('book-overlay').classList.remove('open');
  BR.pdf=null;
}

async function brCalcFit(){
  if(!BR.pdf)return;
  const p=await BR.pdf.getPage(1);
  const vp=p.getViewport({scale:1});
  const stage=document.getElementById('brStage');
  const maxW=(stage.clientWidth-60)/2;
  const maxH=stage.clientHeight-40;
  const scaleW=maxW/vp.width;const scaleH=maxH/vp.height;
  const base=Math.min(scaleW,scaleH);
  BR.baseW=Math.floor(vp.width*base);BR.baseH=Math.floor(vp.height*base);
}

async function brRender(){
  if(!BR.pdf)return;
  const cW=Math.floor(BR.baseW*BR.zoom);const cH=Math.floor(BR.baseH*BR.zoom);
  const cL=document.getElementById('brCanvasL');const cR=document.getElementById('brCanvasR');
  cL.style.width=cW+'px';cL.style.height=cH+'px';cL.width=cW*DPR;cL.height=cH*DPR;
  cR.style.width=cW+'px';cR.style.height=cH+'px';cR.width=cW*DPR;cR.height=cH*DPR;
  const wrap=document.getElementById('br-spread-wrap');wrap.style.width=(cW*2+8)+'px';wrap.style.height=cH+'px';
  const fc=document.getElementById('br-flip-canvas');fc.width=(cW*2+8)*DPR;fc.height=cH*DPR;fc.style.width=(cW*2+8)+'px';fc.style.height=cH+'px';

  const leftNum=BR.leftPage;const rightNum=leftNum===1?null:leftNum+1;
  const ctxL=cL.getContext('2d');const ctxR=cR.getContext('2d');
  ctxL.fillStyle='#faf8f2';ctxL.fillRect(0,0,cL.width,cL.height);
  ctxR.fillStyle='#faf8f2';ctxR.fillRect(0,0,cR.width,cR.height);

  if(leftNum===1){
    const pg=await BR.pdf.getPage(1);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});
    await pg.render({canvasContext:ctxR,viewport:vp}).promise;
  }else{
    if(leftNum<=BR.total){const pg=await BR.pdf.getPage(leftNum);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxL,viewport:vp}).promise;}
    if(rightNum&&rightNum<=BR.total){const pg=await BR.pdf.getPage(rightNum);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxR,viewport:vp}).promise;}
  }
  document.getElementById('brPageInput').value=leftNum===1?1:leftNum;
  const pct=BR.total>1?((leftNum-1)/(BR.total-1))*100:0;
  document.getElementById('brProgressFill').style.width=pct+'%';
  document.getElementById('brZoomVal').textContent=Math.round(BR.zoom*100)+'%';
  document.getElementById('brPrev').disabled=(leftNum<=1);
  document.getElementById('brNext').disabled=(leftNum===1?1>=BR.total:(leftNum+1)>=BR.total);
}

function brGo(dir){
  if(BR.animating||!BR.pdf)return;
  const isCover=(BR.leftPage===1);
  let next;
  if(dir===1){next=isCover?2:BR.leftPage+2;if(next>BR.total)return;}
  else{next=isCover?1:(BR.leftPage===2?1:BR.leftPage-2);if(next<1)return;}
  brAnimateFlip(dir,next,isCover);
}

async function brAnimateFlip(dir,next,isCover){
  BR.animating=true;
  const fc=document.getElementById('br-flip-canvas');const ctx=fc.getContext('2d');
  fc.style.display='block';
  const cW=Math.floor(BR.baseW*BR.zoom);const cH=Math.floor(BR.baseH*BR.zoom);
  const offFront=document.createElement('canvas');offFront.width=cW*DPR;offFront.height=cH*DPR;
  const offBack=document.createElement('canvas');offBack.width=cW*DPR;offBack.height=cH*DPR;
  const ctxF=offFront.getContext('2d');const ctxB=offBack.getContext('2d');
  ctxF.fillStyle='#faf8f2';ctxF.fillRect(0,0,offFront.width,offFront.height);
  ctxB.fillStyle='#faf8f2';ctxB.fillRect(0,0,offBack.width,offBack.height);

  if(dir===1){
    const frontPage=isCover?1:(BR.leftPage+1);
    const backPage=next;
    if(frontPage<=BR.total){const pg=await BR.pdf.getPage(frontPage);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxF,viewport:vp}).promise;}
    if(backPage<=BR.total){const pg=await BR.pdf.getPage(backPage);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxB,viewport:vp}).promise;}
  }else{
    const frontPage=isCover?1:BR.leftPage;
    const backPage=next===1?1:(next+1);
    if(frontPage<=BR.total){const pg=await BR.pdf.getPage(frontPage);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxF,viewport:vp}).promise;}
    if(backPage<=BR.total){const pg=await BR.pdf.getPage(backPage);const vp=pg.getViewport({scale:cW/pg.getViewport({scale:1}).width*DPR});await pg.render({canvasContext:ctxB,viewport:vp}).promise;}
  }

  const TOTAL_MS=400;const startT=performance.now();
  const pivotX=isCover?0:cW+8;
  function easeInOut(t){return t<.5?2*t*t:-1+(4-2*t)*t;}
  function frame(now){
    const elapsed=now-startT;const raw=Math.min(elapsed/TOTAL_MS,1);const t=easeInOut(raw);
    ctx.clearRect(0,0,fc.width,fc.height);
    const pageCSS_W=cW;const pageCSS_H=cH;
    if(dir===1){
      const rightEdge=pivotX+pageCSS_W*(1-t);const leftEdge=pivotX-pageCSS_W*t;const skewTop=pageCSS_W*t*0.05;
      const shadowGrad=ctx.createLinearGradient(rightEdge-30,0,rightEdge+10,0);
      shadowGrad.addColorStop(0,'rgba(0,0,0,0)');shadowGrad.addColorStop(1,'rgba(0,0,0,0.25)');
      ctx.fillStyle=shadowGrad;ctx.fillRect((rightEdge-30)*DPR,0,40*DPR,pageCSS_H*DPR);
      if(t<0.5){
        ctx.save();ctx.beginPath();ctx.moveTo(pivotX*DPR,skewTop*DPR);ctx.lineTo(rightEdge*DPR,0);ctx.lineTo(rightEdge*DPR,pageCSS_H*DPR);ctx.lineTo(pivotX*DPR,(pageCSS_H-skewTop)*DPR);ctx.closePath();ctx.clip();
        ctx.drawImage(offFront,pivotX*DPR,skewTop*DPR,(rightEdge-pivotX)*DPR,(pageCSS_H-skewTop*2)*DPR);
        const hl=ctx.createLinearGradient(pivotX*DPR,0,rightEdge*DPR,0);hl.addColorStop(0,'rgba(255,255,255,0.18)');hl.addColorStop(1,'rgba(0,0,0,0.12)');ctx.fillStyle=hl;ctx.fillRect(pivotX*DPR,0,(rightEdge-pivotX)*DPR,pageCSS_H*DPR);ctx.restore();
      }else{
        const t2=(t-0.5)*2;const leftEdge2=pivotX-pageCSS_W*t2;const skewTop2=pageCSS_W*(1-t2)*0.05;
        ctx.save();ctx.beginPath();ctx.moveTo(leftEdge2*DPR,skewTop2*DPR);ctx.lineTo(pivotX*DPR,0);ctx.lineTo(pivotX*DPR,pageCSS_H*DPR);ctx.lineTo(leftEdge2*DPR,(pageCSS_H-skewTop2)*DPR);ctx.closePath();ctx.clip();
        ctx.drawImage(offBack,leftEdge2*DPR,skewTop2*DPR,(pivotX-leftEdge2)*DPR,(pageCSS_H-skewTop2*2)*DPR);
        const hl=ctx.createLinearGradient(leftEdge2*DPR,0,pivotX*DPR,0);hl.addColorStop(0,'rgba(0,0,0,0.1)');hl.addColorStop(1,'rgba(255,255,255,0.14)');ctx.fillStyle=hl;ctx.fillRect(leftEdge2*DPR,0,(pivotX-leftEdge2)*DPR,pageCSS_H*DPR);ctx.restore();
      }
    }else{
      const leftEdge=pivotX-pageCSS_W*(1-t);const rightEdge=pivotX+pageCSS_W*t;const skewTop=pageCSS_W*t*0.05;
      if(t<0.5){
        ctx.save();ctx.beginPath();ctx.moveTo(leftEdge*DPR,0);ctx.lineTo(pivotX*DPR,skewTop*DPR);ctx.lineTo(pivotX*DPR,(pageCSS_H-skewTop)*DPR);ctx.lineTo(leftEdge*DPR,pageCSS_H*DPR);ctx.closePath();ctx.clip();
        ctx.drawImage(offFront,leftEdge*DPR,0,(pivotX-leftEdge)*DPR,pageCSS_H*DPR);
        const hl=ctx.createLinearGradient(leftEdge*DPR,0,pivotX*DPR,0);hl.addColorStop(0,'rgba(0,0,0,0.1)');hl.addColorStop(1,'rgba(255,255,255,0.16)');ctx.fillStyle=hl;ctx.fillRect(leftEdge*DPR,0,(pivotX-leftEdge)*DPR,pageCSS_H*DPR);ctx.restore();
      }else{
        const t2=(t-.5)*2;const rightEdge2=pivotX+pageCSS_W*t2;const skew2=pageCSS_W*(1-t2)*.05;
        ctx.save();ctx.beginPath();ctx.moveTo(pivotX*DPR,skew2*DPR);ctx.lineTo(rightEdge2*DPR,0);ctx.lineTo(rightEdge2*DPR,pageCSS_H*DPR);ctx.lineTo(pivotX*DPR,(pageCSS_H-skew2)*DPR);ctx.closePath();ctx.clip();
        ctx.drawImage(offBack,pivotX*DPR,skew2*DPR,(rightEdge2-pivotX)*DPR,(pageCSS_H-skew2*2)*DPR);
        const hl=ctx.createLinearGradient(pivotX*DPR,0,rightEdge2*DPR,0);hl.addColorStop(0,'rgba(255,255,255,0.16)');hl.addColorStop(1,'rgba(0,0,0,0.08)');ctx.fillStyle=hl;ctx.fillRect(pivotX*DPR,skew2*DPR,(rightEdge2-pivotX)*DPR,(pageCSS_H-skew2*2)*DPR);ctx.restore();
      }
    }
    if(raw<1){requestAnimationFrame(frame);}else{ctx.clearRect(0,0,fc.width,fc.height);fc.style.display='none';BR.leftPage=next;BR.animating=false;brRender();}
  }
  requestAnimationFrame(frame);
}

function brZoom(dir){
  const steps=[0.5,0.6,0.7,0.8,0.9,1.0,1.1,1.2,1.35,1.5,1.75,2.0,2.5,3.0,4.0];
  let cur=steps.findIndex(s=>Math.abs(s-BR.zoom)<0.01);if(cur===-1)cur=steps.indexOf(1.0);
  const next=Math.max(0,Math.min(steps.length-1,cur+dir));BR.zoom=steps[next];brCalcFit();brRender();
}
function brZoomFit(){BR.zoom=1.0;brCalcFit();brRender();}

document.addEventListener('DOMContentLoaded',()=>{
  const inp=document.getElementById('brPageInput');
  inp.addEventListener('change',()=>{
    let v=parseInt(inp.value,10);if(isNaN(v)||v<1)v=1;if(v>BR.total)v=BR.total;
    if(v===1){BR.leftPage=1;}else{BR.leftPage=v%2===0?v:v-1;if(BR.leftPage<2)BR.leftPage=2;}
    brRender();
  });
});

function brProgressClick(e){
  if(!BR.pdf)return;
  const bar=document.getElementById('brProgressBar');const rect=bar.getBoundingClientRect();
  const pct=(e.clientX-rect.left)/rect.width;
  const target=Math.max(1,Math.min(BR.total,Math.round(pct*(BR.total-1))+1));
  if(target===1){BR.leftPage=1;}else{BR.leftPage=target%2===0?target:target-1;if(BR.leftPage<2)BR.leftPage=2;}
  brRender();
}

document.addEventListener('keydown',e=>{
  const bo=document.getElementById('book-overlay');if(!bo.classList.contains('open'))return;
  if(e.key==='ArrowRight'||e.key==='ArrowDown')brGo(1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')brGo(-1);
  if(e.key==='Escape')closeBook();
});

(()=>{
  let sx=0;const stage=document.getElementById('brStage');
  stage.addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});
  stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)brGo(dx<0?1:-1);});
})();

window.addEventListener('resize',()=>{if(BR.pdf&&document.getElementById('book-overlay').classList.contains('open')){brCalcFit();brRender();}});
</script>
