<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>writings — tarık yiğit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="site-layout">
  <!-- Main Content -->
  <main class="site-content">
    <div class="writings-tabs">
      <button class="writings-tab on" id="tab-all" onclick="switchTab('all')" data-en="all" data-tr="tümü">all</button>
      <button class="writings-tab" id="tab-books" onclick="switchTab('books')" data-en="books" data-tr="kitaplar">books</button>
      <button class="writings-tab" id="tab-poems" onclick="switchTab('poems')" data-en="poems" data-tr="şiirler">poems</button>
      <button class="writings-tab" id="tab-articles" onclick="switchTab('articles')" data-en="articles" data-tr="makaleler">articles</button>
    </div>
    
    <div class="writings-list" id="writings-list"></div>
  </main>

  <!-- Right Sidebar -->
  <aside class="site-sidebar">
    <div class="sidebar-name">
      <a href="index.html">tarık yiğit</a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="about.html" class="sidebar-link" data-en="about" data-tr="hakkında">about</a>
      <a href="writings.html" class="sidebar-link active" data-en="writings" data-tr="yazılar">writings</a>
      <a href="contact.html" class="sidebar-link" data-en="contact" data-tr="iletişim">contact</a>
    </nav>
    
    <div class="sidebar-spacer"></div>
    
    <div class="sidebar-lang">
      <button id="b-en" class="on">EN</button>
      <span>/</span>
      <button id="b-tr">TR</button>
    </div>
  </aside>
</div>

<!-- Reading Overlay -->
<div class="reading-overlay" id="reading-overlay">
  <button class="reading-close" onclick="closeReading()" data-en="← back" data-tr="← geri">← back</button>
  <div class="reading-inner" id="reading-content"></div>
</div>

<!-- Book Reader -->
<div class="book-reader" id="book-reader">
  <div class="book-reader-header">
    <div class="book-reader-title" id="book-title"></div>
    <div class="book-reader-controls">
      <button onclick="bookPrev()">←</button>
      <span id="book-page-info">1 / 1</span>
      <button onclick="bookNext()">→</button>
      <span style="margin: 0 10px; color: var(--line);">|</span>
      <button onclick="bookZoom(-1)">−</button>
      <span id="book-zoom-info">100%</span>
      <button onclick="bookZoom(1)">+</button>
      <span style="margin: 0 10px; color: var(--line);">|</span>
      <button onclick="closeBook()" data-en="close" data-tr="kapat">close</button>
    </div>
  </div>
  <div class="book-reader-body" id="book-body">
    <canvas id="book-canvas" class="book-reader-canvas"></canvas>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
<script src="data.js"></script>
<script>
let currentLang = localStorage.getItem('lang') || 'tr';
let currentTab = 'all';

// Book reader state
let bookPdf = null;
let bookPage = 1;
let bookTotal = 1;
let bookScale = 1.0;

function updateLang() {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = currentLang === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('b-en').classList.toggle('on', currentLang === 'en');
  document.getElementById('b-tr').classList.toggle('on', currentLang === 'tr');
  localStorage.setItem('lang', currentLang);
}

function switchTab(tab) {
  currentTab = tab;
  ['all', 'books', 'poems', 'articles'].forEach(t => {
    document.getElementById('tab-' + t).classList.toggle('on', t === tab);
  });
  buildList();
}

function buildList() {
  const l = currentLang;
  const list = document.getElementById('writings-list');
  list.innerHTML = '';
  
  let items = [];
  
  // Filter out archived
  const activeBooks = (SITE.books || []).filter(b => !b.archived);
  const activePoems = (SITE.poems || []).filter(p => !p.archived);
  const activeArticles = (SITE.articles || []).filter(a => !a.archived);
  
  if (currentTab === 'all' || currentTab === 'books') {
    activeBooks.forEach((b, i) => {
      const idx = SITE.books.findIndex(x => x.id === b.id);
      items.push({
        type: 'book',
        idx: idx,
        title: l === 'tr' ? (b.titleTR || b.title) : b.title,
        meta: b.year || '',
        year: parseInt(b.year) || 0
      });
    });
  }
  
  if (currentTab === 'all' || currentTab === 'poems') {
    activePoems.forEach((p, i) => {
      const idx = SITE.poems.findIndex(x => x.id === p.id);
      items.push({
        type: 'poem',
        idx: idx,
        title: l === 'tr' ? (p.titleTR || p.title) : p.title,
        meta: p.year || '',
        year: parseInt(p.year) || 0
      });
    });
  }
  
  if (currentTab === 'all' || currentTab === 'articles') {
    activeArticles.forEach((a, i) => {
      const idx = SITE.articles.findIndex(x => x.id === a.id);
      const type = l === 'tr' ? (a.typeTR || a.type) : a.type;
      items.push({
        type: 'article',
        idx: idx,
        title: l === 'tr' ? (a.titleTR || a.title) : a.title,
        meta: `${a.year || ''}${type ? ' · ' + type : ''}`,
        year: parseInt(a.year) || 0
      });
    });
  }
  
  // Sort by year descending
  items.sort((a, b) => b.year - a.year);
  
  items.forEach(item => {
    const div = document.createElement('a');
    div.href = '#';
    div.className = 'writing-item';
    div.innerHTML = `
      <div class="writing-title">${item.title}</div>
      <div class="writing-meta">${item.meta}</div>
    `;
    div.addEventListener('click', e => {
      e.preventDefault();
      if (item.type === 'book') openBook(item.idx);
      else if (item.type === 'poem') openPoem(item.idx);
      else if (item.type === 'article') openArticle(item.idx);
    });
    list.appendChild(div);
  });
}

// Reading overlay functions
function openPoem(idx) {
  const p = SITE.poems[idx];
  if (!p) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (p.titleTR || p.title) : p.title;
  const body = l === 'tr' ? (p.bodyTR || p.body) : p.body;
  
  document.getElementById('reading-content').innerHTML = `
    <div class="reading-title">${title}</div>
    <div class="reading-meta">${p.year || ''}</div>
    <div class="reading-body poem">${body || ''}</div>
  `;
  document.getElementById('reading-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openArticle(idx) {
  const a = SITE.articles[idx];
  if (!a) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (a.titleTR || a.title) : a.title;
  const type = l === 'tr' ? (a.typeTR || a.type) : a.type;
  const body = l === 'tr' ? (a.bodyTR || a.body) : a.body;
  
  let html = `
    <div class="reading-title">${title}</div>
    <div class="reading-meta">${a.year || ''}${type ? ' · ' + type : ''}</div>
  `;
  
  // If article has PDF
  if (a.pdf && a.pdf.trim()) {
    const pdfId = 'pdf-' + Math.random().toString(36).substr(2, 9);
    html += `
      ${body ? `<div class="reading-body" style="margin-bottom:30px;"><p>${body}</p></div>` : ''}
      <div class="pdf-viewer-wrap" id="${pdfId}-wrap">
        <div class="pdf-controls">
          <button class="pdf-ctrl-btn" onclick="articlePdfPrev('${pdfId}')">← ${l === 'tr' ? 'önceki' : 'prev'}</button>
          <span class="pdf-page-info" id="${pdfId}-info">1 / 1</span>
          <button class="pdf-ctrl-btn" onclick="articlePdfNext('${pdfId}')">${l === 'tr' ? 'sonraki' : 'next'} →</button>
          <button class="pdf-ctrl-btn" onclick="articlePdfZoom('${pdfId}', -1)">−</button>
          <span class="pdf-zoom-info" id="${pdfId}-zoom">100%</span>
          <button class="pdf-ctrl-btn" onclick="articlePdfZoom('${pdfId}', 1)">+</button>
        </div>
        <div class="pdf-canvas-wrap">
          <canvas id="${pdfId}-canvas"></canvas>
        </div>
      </div>
    `;
    
    document.getElementById('reading-content').innerHTML = html;
    document.getElementById('reading-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
    
    // Load PDF
    loadArticlePdf(pdfId, a.pdf);
  } else {
    const paras = (body || '').split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
    html += `<div class="reading-body">${paras}</div>`;
    
    document.getElementById('reading-content').innerHTML = html;
    document.getElementById('reading-overlay').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
}

function closeReading() {
  document.getElementById('reading-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// Article PDF viewer
const articlePdfs = {};

async function loadArticlePdf(pdfId, path) {
  try {
    const pdf = await pdfjsLib.getDocument(path).promise;
    articlePdfs[pdfId] = { pdf, page: 1, scale: 1.0 };
    renderArticlePdf(pdfId);
  } catch (err) {
    console.error('PDF load error:', err);
  }
}

async function renderArticlePdf(pdfId) {
  const state = articlePdfs[pdfId];
  if (!state) return;
  
  const page = await state.pdf.getPage(state.page);
  const viewport = page.getViewport({ scale: state.scale * 1.5 });
  
  const canvas = document.getElementById(pdfId + '-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  
  await page.render({ canvasContext: ctx, viewport }).promise;
  
  document.getElementById(pdfId + '-info').textContent = `${state.page} / ${state.pdf.numPages}`;
  document.getElementById(pdfId + '-zoom').textContent = Math.round(state.scale * 100) + '%';
}

function articlePdfPrev(pdfId) {
  const state = articlePdfs[pdfId];
  if (state && state.page > 1) {
    state.page--;
    renderArticlePdf(pdfId);
  }
}

function articlePdfNext(pdfId) {
  const state = articlePdfs[pdfId];
  if (state && state.page < state.pdf.numPages) {
    state.page++;
    renderArticlePdf(pdfId);
  }
}

function articlePdfZoom(pdfId, dir) {
  const state = articlePdfs[pdfId];
  if (!state) return;
  state.scale = Math.max(0.5, Math.min(3, state.scale + dir * 0.25));
  renderArticlePdf(pdfId);
}

// Book reader functions
async function openBook(idx) {
  const b = SITE.books[idx];
  if (!b || !b.pdf) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (b.titleTR || b.title) : b.title;
  
  document.getElementById('book-title').textContent = title;
  document.getElementById('book-reader').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  try {
    bookPdf = await pdfjsLib.getDocument(b.pdf).promise;
    bookPage = 1;
    bookTotal = bookPdf.numPages;
    bookScale = 1.0;
    renderBook();
  } catch (err) {
    console.error('Book load error:', err);
  }
}

async function renderBook() {
  if (!bookPdf) return;
  
  const page = await bookPdf.getPage(bookPage);
  const viewport = page.getViewport({ scale: bookScale * 1.5 });
  
  const canvas = document.getElementById('book-canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  
  await page.render({ canvasContext: ctx, viewport }).promise;
  
  document.getElementById('book-page-info').textContent = `${bookPage} / ${bookTotal}`;
  document.getElementById('book-zoom-info').textContent = Math.round(bookScale * 100) + '%';
}

function bookPrev() {
  if (bookPage > 1) {
    bookPage--;
    renderBook();
  }
}

function bookNext() {
  if (bookPage < bookTotal) {
    bookPage++;
    renderBook();
  }
}

function bookZoom(dir) {
  bookScale = Math.max(0.5, Math.min(3, bookScale + dir * 0.25));
  renderBook();
}

function closeBook() {
  document.getElementById('book-reader').classList.remove('open');
  document.body.style.overflow = '';
  bookPdf = null;
}

// ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('book-reader').classList.contains('open')) {
      closeBook();
    } else if (document.getElementById('reading-overlay').classList.contains('open')) {
      closeReading();
    }
  }
});

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateLang();
  buildList();
  
  document.getElementById('b-en').addEventListener('click', () => {
    currentLang = 'en';
    updateLang();
    buildList();
  });
  
  document.getElementById('b-tr').addEventListener('click', () => {
    currentLang = 'tr';
    updateLang();
    buildList();
  });
});
</script>

</body>
</html>
