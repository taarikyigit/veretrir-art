<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>writings — tarık yiğit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Main Content -->
    <main class="main-content">
      <!-- Tabs -->
      <div class="writings-tabs">
        <button class="active" data-tab="all" data-en="all" data-tr="tümü">all</button>
        <button data-tab="books" data-en="books" data-tr="kitaplar">books</button>
        <button data-tab="poems" data-en="poems" data-tr="şiirler">poems</button>
        <button data-tab="articles" data-en="articles" data-tr="yazılar">articles</button>
      </div>

      <!-- All Panel -->
      <div class="writings-panel active" id="panel-all">
        <div class="books-grid" id="all-books"></div>
        <div class="writings-list" id="all-writings" style="margin-top:30px;"></div>
      </div>

      <!-- Books Panel -->
      <div class="writings-panel" id="panel-books">
        <div class="books-grid" id="only-books"></div>
      </div>

      <!-- Poems Panel -->
      <div class="writings-panel" id="panel-poems">
        <div class="writings-list" id="only-poems"></div>
      </div>

      <!-- Articles Panel -->
      <div class="writings-panel" id="panel-articles">
        <div class="writings-list" id="only-articles"></div>
      </div>
    </main>

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-name">
        <a href="index.html">tarık yiğit</a>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" data-en="artworks" data-tr="eserler">artworks</a>
        <a href="about.html" data-en="about" data-tr="hakkında">about</a>
        <a href="writings.html" class="active" data-en="writings" data-tr="yazılar">writings</a>
        <div class="nav-item-group">
          <a href="#" class="nav-main" onclick="return false;" data-en="simulations" data-tr="simülasyonlar">simulations</a>
        </div>
        <div class="series-dropdown sim-dropdown">
          <a href="simulations/kaplanmis_golgesi.html" target="_blank" class="series-link">shadow of the object</a>
          <a href="simulations/hayat_doner.html" target="_blank" class="series-link">life revolves</a>
          <a href="simulations/yercekiminin_izi.html" target="_blank" class="series-link">trace of gravity</a>
        </div>
        <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
      </div>
      <div class="sidebar-bottom">
        <div class="lang-switch">
          <button id="btn-en" class="active">EN</button>
          <button id="btn-tr">TR</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Reading Overlay (for poems/articles) -->
  <div class="reading-overlay" id="reading-overlay">
    <button class="reading-close" onclick="closeReading()">×</button>
    <div class="reading-content" id="reading-content"></div>
  </div>

  <!-- Book Reader -->
  <div class="book-reader" id="book-reader">
    <div class="br-toolbar">
      <span class="br-title" id="br-title"></span>
      <div class="br-controls">
        <div class="br-page-nav">
          <button class="br-btn" onclick="brNav(-1)">‹</button>
          <input class="br-page-input" id="br-page-input" type="number" min="1" value="1">
          <span id="br-page-total">/ 1</span>
          <button class="br-btn" onclick="brNav(1)">›</button>
        </div>
        <button class="br-btn" onclick="brZoom(-1)">−</button>
        <span id="br-zoom">100%</span>
        <button class="br-btn" onclick="brZoom(1)">+</button>
        <button class="br-btn" onclick="closeBook()" data-en="close" data-tr="kapat">close</button>
      </div>
    </div>
    <div class="br-stage" id="br-stage">
      <div class="br-loading" id="br-loading">Loading...</div>
      <canvas class="br-canvas" id="br-canvas"></canvas>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  </script>
  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
/* ════════════════════════════════════════════
   BUILD LISTS
════════════════════════════════════════════ */
function buildLists() {
  const l = currentLang;
  
  // Filter archived
  const books = (SITE.books || []).filter(b => !b.archived);
  const poems = (SITE.poems || []).filter(p => !p.archived);
  const articles = (SITE.articles || []).filter(a => !a.archived);
  
  // Sort by year descending
  const sortByYear = (a, b) => (b.year || 0) - (a.year || 0);
  
  // Books
  ['all-books', 'only-books'].forEach(id => {
    const el = document.getElementById(id);
    el.innerHTML = '';
    books.sort(sortByYear).forEach((b, i) => {
      const actualIdx = SITE.books.findIndex(x => x.id === b.id);
      el.appendChild(makeBookItem(b, actualIdx));
    });
  });
  
  // Combined poems + articles for "all" tab
  const allWritings = [
    ...poems.map((p, i) => ({ type: 'poem', item: p, idx: SITE.poems.findIndex(x => x.id === p.id) })),
    ...articles.map((a, i) => ({ type: 'article', item: a, idx: SITE.articles.findIndex(x => x.id === a.id) }))
  ].sort((a, b) => (b.item.year || 0) - (a.item.year || 0));
  
  const allWritingsEl = document.getElementById('all-writings');
  allWritingsEl.innerHTML = '';
  allWritings.forEach(w => {
    allWritingsEl.appendChild(makeWritingItem(w.type, w.item, w.idx));
  });
  
  // Poems only
  const poemsEl = document.getElementById('only-poems');
  poemsEl.innerHTML = '';
  poems.sort(sortByYear).forEach((p, i) => {
    const actualIdx = SITE.poems.findIndex(x => x.id === p.id);
    poemsEl.appendChild(makeWritingItem('poem', p, actualIdx));
  });
  
  // Articles only
  const articlesEl = document.getElementById('only-articles');
  articlesEl.innerHTML = '';
  articles.sort(sortByYear).forEach((a, i) => {
    const actualIdx = SITE.articles.findIndex(x => x.id === a.id);
    articlesEl.appendChild(makeWritingItem('article', a, actualIdx));
  });
}

function makeBookItem(book, idx) {
  const l = currentLang;
  const title = l === 'tr' ? (book.titleTR || book.title) : book.title;
  
  const div = document.createElement('div');
  div.className = 'book-item';
  div.innerHTML = `
    ${book.cover 
      ? `<img class="book-cover" src="${_esc(book.cover)}" alt="${_esc(title)}">`
      : `<div class="book-cover-placeholder">PDF</div>`
    }
    <div class="book-title">${_esc(title)}</div>
    <div class="book-year">${book.year || ''}</div>
  `;
  div.addEventListener('click', () => openBook(idx));
  return div;
}

function makeWritingItem(type, item, idx) {
  const l = currentLang;
  const title = l === 'tr' ? (item.titleTR || item.title) : item.title;
  const typeLabel = type === 'article' 
    ? (l === 'tr' ? (item.typeTR || item.type) : item.type)
    : (l === 'tr' ? 'şiir' : 'poem');
  
  const a = document.createElement('a');
  a.href = '#';
  a.className = 'writing-item';
  a.innerHTML = `
    <div class="writing-item-title">${_esc(title)}</div>
    <div class="writing-item-meta">${item.year || ''} · ${typeLabel}</div>
  `;
  a.addEventListener('click', e => {
    e.preventDefault();
    if (type === 'poem') openPoem(idx);
    else openArticle(idx);
  });
  return a;
}

/* ════════════════════════════════════════════
   TABS
════════════════════════════════════════════ */
function switchTab(tab) {
  document.querySelectorAll('.writings-tabs button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.writings-panel').forEach(panel => {
    panel.classList.toggle('active', panel.id === 'panel-' + tab);
  });
}

/* ════════════════════════════════════════════
   READING OVERLAY (Poems / Articles)
════════════════════════════════════════════ */
function openPoem(idx) {
  const poem = SITE.poems[idx];
  if (!poem) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (poem.titleTR || poem.title) : poem.title;
  const body = l === 'tr' ? (poem.bodyTR || poem.body) : poem.body;
  
  const content = document.getElementById('reading-content');
  content.innerHTML = `
    <div class="reading-title">${_esc(title)}</div>
    <div class="reading-meta">${poem.year || ''}</div>
    <div class="reading-body">${_esc(body)}</div>
  `;
  
  document.getElementById('reading-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function openArticle(idx) {
  const article = SITE.articles[idx];
  if (!article) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (article.titleTR || article.title) : article.title;
  const typeLabel = l === 'tr' ? (article.typeTR || article.type) : article.type;
  
  const content = document.getElementById('reading-content');
  
  // Check if article has PDF
  if (article.pdf) {
    content.innerHTML = `
      <div class="reading-title">${_esc(title)}</div>
      <div class="reading-meta">${article.year || ''} · ${typeLabel}</div>
      <iframe class="pdf-viewer" src="https://mozilla.github.io/pdf.js/web/viewer.html?file=${encodeURIComponent(location.origin + '/' + article.pdf)}#pagemode=none"></iframe>
    `;
  } else {
    const body = l === 'tr' ? (article.bodyTR || article.body) : article.body;
    content.innerHTML = `
      <div class="reading-title">${_esc(title)}</div>
      <div class="reading-meta">${article.year || ''} · ${typeLabel}</div>
      <div class="reading-body">${_esc(body)}</div>
    `;
  }
  
  document.getElementById('reading-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeReading() {
  document.getElementById('reading-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

/* ════════════════════════════════════════════
   BOOK READER (PDF)
════════════════════════════════════════════ */
let brPdf = null;
let brPage = 1;
let brTotalPages = 1;
let brScale = 1.5;

function openBook(idx) {
  const book = SITE.books[idx];
  if (!book || !book.pdf) return;
  
  const l = currentLang;
  document.getElementById('br-title').textContent = l === 'tr' ? (book.titleTR || book.title) : book.title;
  
  document.getElementById('book-reader').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  document.getElementById('br-loading').style.display = '';
  document.getElementById('br-canvas').style.display = 'none';
  
  pdfjsLib.getDocument(book.pdf).promise.then(pdf => {
    brPdf = pdf;
    brTotalPages = pdf.numPages;
    brPage = 1;
    document.getElementById('br-page-total').textContent = '/ ' + brTotalPages;
    document.getElementById('br-page-input').max = brTotalPages;
    renderBrPage();
  });
}

function renderBrPage() {
  if (!brPdf) return;
  
  brPdf.getPage(brPage).then(page => {
    const canvas = document.getElementById('br-canvas');
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: brScale });
    
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    page.render({ canvasContext: ctx, viewport: viewport }).promise.then(() => {
      document.getElementById('br-loading').style.display = 'none';
      canvas.style.display = '';
    });
  });
  
  document.getElementById('br-page-input').value = brPage;
  document.getElementById('br-zoom').textContent = Math.round(brScale * 100) + '%';
}

function brNav(dir) {
  brPage += dir;
  if (brPage < 1) brPage = 1;
  if (brPage > brTotalPages) brPage = brTotalPages;
  renderBrPage();
}

function brZoom(dir) {
  brScale += dir * 0.25;
  if (brScale < 0.5) brScale = 0.5;
  if (brScale > 3) brScale = 3;
  renderBrPage();
}

function closeBook() {
  document.getElementById('book-reader').classList.remove('open');
  document.body.style.overflow = '';
  brPdf = null;
}

/* ════════════════════════════════════════════
   LANGUAGE
════════════════════════════════════════════ */
function updateLangTexts() {
  const l = currentLang;
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-tr').classList.toggle('active', l === 'tr');
  
  // Update simulation links
  const simLinks = document.querySelectorAll('.sim-dropdown .series-link');
  const simNames = [
    { en: 'shadow of the object', tr: 'nesnenin kaplanmış gölgesi' },
    { en: 'life revolves', tr: 'hayat döner' },
    { en: 'trace of gravity', tr: 'yerçekiminin izi' }
  ];
  simLinks.forEach((link, i) => {
    if (simNames[i]) {
      link.textContent = l === 'tr' ? simNames[i].tr : simNames[i].en;
    }
  });
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildLists();
  updateLangTexts();
  
  // Tab clicks
  document.querySelectorAll('.writings-tabs button').forEach(btn => {
    btn.addEventListener('click', () => switchTab(btn.dataset.tab));
  });
  
  // Language switches
  document.getElementById('btn-en').addEventListener('click', () => {
    setLang('en');
    buildLists();
    updateLangTexts();
  });
  
  document.getElementById('btn-tr').addEventListener('click', () => {
    setLang('tr');
    buildLists();
    updateLangTexts();
  });
  
  // Page input for book reader
  document.getElementById('br-page-input').addEventListener('change', e => {
    brPage = parseInt(e.target.value) || 1;
    if (brPage < 1) brPage = 1;
    if (brPage > brTotalPages) brPage = brTotalPages;
    renderBrPage();
  });
  
  // Keyboard
  document.addEventListener('keydown', e => {
    if (document.getElementById('reading-overlay').classList.contains('open')) {
      if (e.key === 'Escape') closeReading();
    }
    if (document.getElementById('book-reader').classList.contains('open')) {
      if (e.key === 'Escape') closeBook();
      if (e.key === 'ArrowLeft') brNav(-1);
      if (e.key === 'ArrowRight') brNav(1);
    }
  });
});
  </script>
</body>
</html>
