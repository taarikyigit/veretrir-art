<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>tarık yiğit</title>
<link rel="stylesheet" href="style.css"/>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
<style>
/* ── HOME LAYOUT ── */
.home-wrap {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: 100vh;
}

/* Left panel — name + nav */
.home-left {
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  padding: 0 40px 60px;
}
.home-name {
  font-size: 15px;
  font-weight: 400;
  letter-spacing: 0.04em;
  text-transform: lowercase;
  margin-bottom: 24px;
  line-height: 1.4;
}
.home-nav { display: flex; flex-direction: column; gap: 6px; }
.home-nav a {
  font-size: 11px;
  letter-spacing: 0.05em;
  text-transform: lowercase;
  color: var(--mid);
  text-decoration: none;
  transition: color 0.2s;
}
.home-nav a:hover { color: var(--ink); }
.home-lang {
  margin-top: 20px;
  display: flex; gap: 6px; align-items: center;
}
.home-ig {
  margin-top: 16px;
}
.home-ig a {
  display: inline-flex; align-items: center;
  text-decoration: none; color: var(--dim);
  transition: color 0.2s;
}
.home-ig a:hover { color: var(--ink); }
.home-ig svg { width: 14px; height: 14px; }

/* Right panel — image slideshow with overlay */
.home-right {
  position: relative;
  overflow: hidden;
  background: #f5f5f5;
}

.hero-slide {
  position: absolute;
  inset: 0;
  opacity: 0;
  transition: opacity 0.8s ease;
}
.hero-slide.active { opacity: 1; }

.hero-slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  animation: kenBurns 8s ease-in-out infinite alternate;
}

@keyframes kenBurns {
  0% { transform: scale(1) translate(0, 0); }
  100% { transform: scale(1.08) translate(-1%, -1%); }
}

/* Pause animation when not active */
.hero-slide:not(.active) img {
  animation-play-state: paused;
}

.hero-slide-ph {
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0f0f0;
}
.hero-slide-ph span {
  font-size: 10px;
  letter-spacing: 0.15em;
  text-transform: lowercase;
  color: var(--dim);
}

/* Progress bar for slides */
.hero-progress {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 0%;
  height: 2px;
  background: rgba(255,255,255,0.6);
  z-index: 3;
  transition: width 0.1s linear;
}

/* Hero overlay with artwork info */
.hero-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 40px;
  background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, rgba(0,0,0,0) 100%);
  opacity: 0;
  transition: opacity 0.4s ease;
}
.hero-slide.active .hero-overlay { opacity: 1; }

.hero-overlay-title {
  font-size: 18px;
  color: #fff;
  text-transform: lowercase;
  margin-bottom: 6px;
  font-weight: 400;
}
.hero-overlay-meta {
  font-size: 11px;
  color: rgba(255,255,255,0.7);
  text-transform: lowercase;
  letter-spacing: 0.05em;
  margin-bottom: 16px;
}
.hero-overlay-link {
  display: inline-block;
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: lowercase;
  color: #fff;
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.5);
  padding: 8px 16px;
  transition: all 0.2s;
}
.hero-overlay-link:hover {
  background: #fff;
  color: #000;
  border-color: #fff;
}

/* Minimal dot nav */
.hero-dots {
  position: absolute;
  bottom: 24px;
  right: 24px;
  z-index: 2;
  display: flex;
  gap: 6px;
}
.hero-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
  background: rgba(255,255,255,0.4);
  border: none;
  cursor: pointer;
  padding: 0;
  transition: background 0.3s;
}
.hero-dot.on { background: rgba(255,255,255,0.9); }

/* ── Responsive ── */
@media (max-width: 800px) {
  .home-wrap {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }
  .home-right { min-height: 60vh; order: -1; }
  .home-left {
    padding: 32px 20px 40px;
    justify-content: flex-start;
  }
  .hero-overlay { padding: 24px; }
  .hero-overlay-title { font-size: 16px; }
}
</style>
</head>
<body>

<div id="page-transition-mask" style="position:fixed;inset:0;background:#fff;z-index:9000;"></div>

<div class="home-wrap">
  <!-- LEFT: name + nav -->
  <div class="home-left">
    <div class="home-name">tarık yiğit</div>
    <div class="home-nav">
      <a href="artworks.html" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
      <a href="about.html" data-en="about" data-tr="hakkında">about</a>
      <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
    </div>
    <div class="home-lang">
      <button class="lb on" id="b-en" onclick="setLang('en')">en</button>
      <span class="lang-sep">·</span>
      <button class="lb" id="b-tr" onclick="setLang('tr')">tr</button>
    </div>
    <div class="home-ig">
      <a href="https://instagram.com/veretrir" target="_blank" rel="noopener" data-no-transition>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
        </svg>
      </a>
    </div>
  </div>

  <!-- RIGHT: image slideshow with artwork info -->
  <div class="home-right" id="heroArea">
    <div class="hero-progress" id="heroProgress"></div>
    <div class="hero-dots" id="heroDots"></div>
  </div>
</div>

<!-- READING OVERLAY -->
<div id="reading-overlay">
  <div class="reading-topbar">
    <span class="reading-badge" id="reading-badge"></span>
    <span class="reading-top-title" id="reading-top-title"></span>
  </div>
  <div class="reading-body" id="reading-body"></div>
</div>
<button id="back-fab" onclick="closeReading()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
  <span data-en="back" data-tr="geri">back</span>
</button>

<!-- 3D viewer -->
<div id="viewer-overlay">
  <div class="viewer-topbar">
    <span class="viewer-title" id="viewer-title-el"></span>
    <button class="viewer-close" onclick="closeViewer()" data-en="close" data-tr="kapat">close</button>
  </div>
  <model-viewer id="model-viewer-el" camera-controls auto-rotate shadow-intensity="1" exposure="0.75"
    style="background:#000;width:100%;height:100%;flex:1;"></model-viewer>
</div>

<script src="data.js"></script>
<script src="common.js"></script>
<script>
/* ═══ HERO SLIDESHOW WITH ARTWORK INFO ═══ */
(function() {
  const area = document.getElementById('heroArea');
  const dotsEl = document.getElementById('heroDots');
  const l = currentLang;

  const featuredWorks = SITE.artworks.filter(aw => aw.featured === true);
  const pool = featuredWorks.length >= 3 ? featuredWorks : SITE.artworks;

  // Pick up to 5 random works
  const shuffled = [...pool].sort(() => Math.random() - 0.5);
  const selected = shuffled.slice(0, Math.min(5, shuffled.length));

  if (!selected.length) return;

  const INTERVAL = 5000;
  let cur = 0, timer;

  // Build slides with artwork info overlay
  selected.forEach((aw, i) => {
    // Find the CORRECT index in SITE.artworks for this artwork
    const correctIdx = SITE.artworks.findIndex(a => a.id === aw.id);
    
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.dataset.awId = aw.id;
    slide.dataset.awIdx = correctIdx;

    const heroImg = _mainImg(aw) || _getDisplayImage(aw);
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
    const seeText = l === 'tr' ? 'eseri gör' : 'see artwork';

    if (heroImg) {
      slide.innerHTML = `
        <img src="${heroImg}" alt="${_esc(title)}">
        <div class="hero-overlay">
          <div class="hero-overlay-title">${_esc(title)}</div>
          <div class="hero-overlay-meta">${medium ? _esc(medium) : ''}${medium && aw.year ? ' · ' : ''}${aw.year || ''}</div>
          <a href="#" class="hero-overlay-link" data-aw-idx="${correctIdx}">${seeText}</a>
        </div>`;
    } else {
      slide.innerHTML = '<div class="hero-slide-ph"><span>—</span></div>';
    }

    area.insertBefore(slide, dotsEl);
  });

  // Handle "see artwork" link clicks
  area.addEventListener('click', function(e) {
    const link = e.target.closest('.hero-overlay-link');
    if (link) {
      e.preventDefault();
      const idx = parseInt(link.dataset.awIdx, 10);
      if (idx >= 0) openArtwork(idx);
      return;
    }
    
    // Clicking on slide image (not the overlay link) also opens artwork
    const slide = e.target.closest('.hero-slide');
    if (slide && !e.target.closest('.hero-overlay')) {
      const idx = parseInt(slide.dataset.awIdx, 10);
      if (idx >= 0) openArtwork(idx);
    }
  });

  // Dots
  selected.forEach((_, i) => {
    const dot = document.createElement('button');
    dot.className = 'hero-dot' + (i === 0 ? ' on' : '');
    dot.addEventListener('click', e => { e.stopPropagation(); goTo(i); });
    dotsEl.appendChild(dot);
  });

  // Progress bar
  const progressBar = document.getElementById('heroProgress');
  let progressStart = Date.now();

  function updateProgress() {
    const elapsed = Date.now() - progressStart;
    const percent = Math.min((elapsed / INTERVAL) * 100, 100);
    if (progressBar) progressBar.style.width = percent + '%';
    if (percent < 100) requestAnimationFrame(updateProgress);
  }

  function goTo(n) {
    const slides = area.querySelectorAll('.hero-slide');
    const dots = dotsEl.querySelectorAll('.hero-dot');
    slides[cur]?.classList.remove('active');
    cur = (n + selected.length) % selected.length;
    slides[cur]?.classList.add('active');
    dots.forEach((d, i) => d.classList.toggle('on', i === cur));
    clearInterval(timer);
    timer = setInterval(() => goTo(cur + 1), INTERVAL);
    
    // Reset progress bar
    progressStart = Date.now();
    if (progressBar) progressBar.style.width = '0%';
    requestAnimationFrame(updateProgress);
  }

  timer = setInterval(() => goTo(cur + 1), INTERVAL);
  requestAnimationFrame(updateProgress);

  // Touch swipe
  let tsx = 0;
  area.addEventListener('touchstart', e => { tsx = e.touches[0].clientX; }, { passive: true });
  area.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - tsx;
    if (Math.abs(dx) > 50) goTo(cur + (dx < 0 ? 1 : -1));
  });
})();
</script>
</body>
</html>
