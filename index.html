<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tarık yiğit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="site-layout">
  <!-- Main Content -->
  <main class="site-content">
    <div class="gallery-grid" id="gallery"></div>
  </main>

  <!-- Right Sidebar -->
  <aside class="site-sidebar">
    <div class="sidebar-name">
      <a href="index.html">tarık yiğit</a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link active" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="about.html" class="sidebar-link" data-en="about" data-tr="hakkında">about</a>
      <a href="writings.html" class="sidebar-link" data-en="writings" data-tr="yazılar">writings</a>
      <a href="contact.html" class="sidebar-link" data-en="contact" data-tr="iletişim">contact</a>
    </nav>
    
    <div class="sidebar-spacer"></div>
    
    <div class="sidebar-lang">
      <button id="b-en" class="on">EN</button>
      <span>/</span>
      <button id="b-tr">TR</button>
    </div>
  </aside>
</div>

<!-- Lightbox for artwork detail -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" onclick="closeLightbox()" data-en="← back" data-tr="← geri">← back</button>
  <div class="lightbox-inner" id="lightbox-content"></div>
</div>

<!-- 3D Viewer -->
<div class="viewer-overlay" id="viewer-overlay">
  <div class="viewer-header">
    <div class="viewer-title" id="viewer-title"></div>
    <button class="viewer-close" onclick="closeViewer()" data-en="close" data-tr="kapat">close</button>
  </div>
  <div class="viewer-body">
    <model-viewer id="model-viewer-el" camera-controls auto-rotate shadow-intensity="1" exposure="0.8"></model-viewer>
  </div>
</div>

<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
<script src="data.js"></script>
<script src="common.js"></script>
<script>
let currentLang = localStorage.getItem('lang') || 'tr';
let currentArtworkIndex = 0;
let visibleArtworks = [];

function updateLang() {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = currentLang === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('b-en').classList.toggle('on', currentLang === 'en');
  document.getElementById('b-tr').classList.toggle('on', currentLang === 'tr');
  localStorage.setItem('lang', currentLang);
}

function buildGallery() {
  const l = currentLang;
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  
  // Filter out archived
  visibleArtworks = (SITE.artworks || []).filter(aw => !aw.archived);
  
  visibleArtworks.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
    const displayImg = aw.displayImage || (aw.images && aw.images[0] ? aw.images[0].path : '');
    
    if (!displayImg) return;
    
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `
      <img src="${displayImg}" alt="${title}" loading="lazy">
      <div class="gallery-item-info">
        <div class="gallery-item-title">${title}</div>
        <div class="gallery-item-meta">${medium || ''}${aw.year ? ', ' + aw.year : ''}</div>
      </div>
    `;
    item.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(item);
  });
}

function openLightbox(idx) {
  currentArtworkIndex = idx;
  const aw = visibleArtworks[idx];
  if (!aw) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
  const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
  const desc = l === 'tr' ? (aw.descTR || aw.desc) : aw.desc;
  
  // Main image
  const mainImg = (aw.images && aw.images[0]) ? aw.images[0].path : aw.displayImage;
  
  let html = `
    <div class="lightbox-image">
      <img src="${mainImg}" alt="${title}">
    </div>
    <div class="lightbox-title">${title}</div>
    <div class="lightbox-meta">${medium || ''}${aw.year ? ', ' + aw.year : ''}</div>
  `;
  
  if (desc) {
    const paras = desc.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
    html += `<div class="lightbox-desc">${paras}</div>`;
  }
  
  // Additional images
  if (aw.images && aw.images.length > 1) {
    html += '<div class="lightbox-gallery">';
    for (let i = 1; i < aw.images.length; i++) {
      html += `<img src="${aw.images[i].path}" alt="${title}">`;
    }
    html += '</div>';
  }
  
  // 3D model button
  if (aw.workType === '3d' && aw.materials && aw.materials.length) {
    const glbFile = aw.materials.find(m => m.path && m.path.endsWith('.glb'));
    if (glbFile) {
      html += `
        <div style="margin-top:30px;">
          <button onclick="openViewer('${glbFile.path}', '${title.replace(/'/g, "\\'")}')" style="
            font-family: var(--font);
            font-size: 14px;
            color: var(--mid);
            background: none;
            border: 1px solid var(--line);
            padding: 10px 20px;
            cursor: pointer;
          ">${l === 'tr' ? '3D görüntüle' : 'View in 3D'}</button>
        </div>
      `;
    }
  }
  
  // Navigation
  html += `
    <div class="lightbox-nav">
      <button onclick="navLightbox(-1)" ${idx === 0 ? 'disabled style="opacity:0.3"' : ''}>← ${l === 'tr' ? 'önceki' : 'previous'}</button>
      <button onclick="navLightbox(1)" ${idx === visibleArtworks.length - 1 ? 'disabled style="opacity:0.3"' : ''}>${l === 'tr' ? 'sonraki' : 'next'} →</button>
    </div>
  `;
  
  document.getElementById('lightbox-content').innerHTML = html;
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  const newIdx = currentArtworkIndex + dir;
  if (newIdx >= 0 && newIdx < visibleArtworks.length) {
    openLightbox(newIdx);
  }
}

function openViewer(src, title) {
  const mv = document.getElementById('model-viewer-el');
  mv.setAttribute('src', src);
  document.getElementById('viewer-title').textContent = title;
  document.getElementById('viewer-overlay').classList.add('open');
}

function closeViewer() {
  document.getElementById('viewer-overlay').classList.remove('open');
  document.getElementById('model-viewer-el').removeAttribute('src');
}

// ESC key
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.getElementById('viewer-overlay').classList.contains('open')) {
      closeViewer();
    } else if (document.getElementById('lightbox').classList.contains('open')) {
      closeLightbox();
    }
  }
  // Arrow keys for lightbox nav
  if (document.getElementById('lightbox').classList.contains('open')) {
    if (e.key === 'ArrowLeft') navLightbox(-1);
    if (e.key === 'ArrowRight') navLightbox(1);
  }
});

// Init
document.addEventListener('DOMContentLoaded', () => {
  updateLang();
  buildGallery();
  
  document.getElementById('b-en').addEventListener('click', () => {
    currentLang = 'en';
    updateLang();
    buildGallery();
  });
  
  document.getElementById('b-tr').addEventListener('click', () => {
    currentLang = 'tr';
    updateLang();
    buildGallery();
  });
});
</script>

</body>
</html>
