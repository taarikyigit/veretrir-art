<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tarık yiğit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Main Content (Left) -->
    <main class="main-content">
      <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- Sidebar (Right) -->
    <nav class="sidebar">
      <div class="sidebar-name">
        <a href="index.html">tarık yiğit</a>
      </div>
      <div class="sidebar-nav">
        <!-- Artworks with series dropdown -->
        <div class="nav-item-group">
          <a href="index.html" class="nav-main active" data-en="artworks" data-tr="eserler">artworks</a>
          <button class="nav-toggle" id="series-toggle" aria-label="Toggle series">
            <span class="toggle-arrow">▼</span>
          </button>
        </div>
        <div class="series-dropdown" id="series-dropdown">
          <a href="#" class="series-link active" data-series="all" data-en="all works" data-tr="tüm eserler">all works</a>
          <!-- Series items will be populated by JS -->
        </div>
        
        <a href="about.html" data-en="about" data-tr="hakkında">about</a>
        <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
        <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
      </div>
      <div class="sidebar-bottom">
        <div class="lang-switch">
          <button id="btn-en" class="active">EN</button>
          <button id="btn-tr">TR</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

  <!-- 3D Viewer Overlay -->
  <div class="viewer-overlay" id="viewer-overlay">
    <button class="viewer-close" onclick="closeViewer()">×</button>
    <div class="viewer-container">
      <canvas id="viewer3d-canvas"></canvas>
    </div>
    <div class="viewer-hint" data-en="drag to rotate · scroll to zoom" data-tr="döndürmek için sürükle · yakınlaştırmak için kaydır">drag to rotate · scroll to zoom</div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let currentArtworks = [];
let currentLightboxIndex = 0;
let currentSeries = 'all';
let seriesOpen = true;

/* ════════════════════════════════════════════
   SERIES DROPDOWN
════════════════════════════════════════════ */
function buildSeriesDropdown() {
  const dropdown = document.getElementById('series-dropdown');
  const l = currentLang;
  
  // Keep the "all works" link
  let html = `<a href="#" class="series-link ${currentSeries === 'all' ? 'active' : ''}" data-series="all">${l === 'tr' ? 'tüm eserler' : 'all works'}</a>`;
  
  // Add series from data
  const series = SITE.series || [];
  series.forEach(s => {
    const name = l === 'tr' ? (s.tr || s.en) : s.en;
    const isActive = currentSeries === s.en;
    html += `<a href="#" class="series-link ${isActive ? 'active' : ''}" data-series="${s.en}">${name}</a>`;
  });
  
  dropdown.innerHTML = html;
  
  // Add click handlers
  dropdown.querySelectorAll('.series-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      currentSeries = link.dataset.series;
      dropdown.querySelectorAll('.series-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      buildGallery();
    });
  });
}

function toggleSeries() {
  seriesOpen = !seriesOpen;
  const dropdown = document.getElementById('series-dropdown');
  const arrow = document.querySelector('.toggle-arrow');
  dropdown.classList.toggle('open', seriesOpen);
  arrow.style.transform = seriesOpen ? 'rotate(0deg)' : 'rotate(-90deg)';
}

/* ════════════════════════════════════════════
   MASONRY GALLERY
════════════════════════════════════════════ */
function buildGallery() {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  const l = currentLang;
  
  // Filter out archived
  let artworks = (SITE.artworks || []).filter(a => !a.archived);
  
  // Filter by series if selected
  if (currentSeries !== 'all') {
    artworks = artworks.filter(a => {
      const awSeries = (a.series || '').toLowerCase().trim();
      return awSeries === currentSeries.toLowerCase().trim();
    });
  }
  
  currentArtworks = artworks;
  
  artworks.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const displayImg = aw.displayImage || (aw.images && aw.images[0] ? aw.images[0].path : null);
    
    if (!displayImg) return;
    
    const div = document.createElement('div');
    div.className = 'gallery-item';
    
    // Create image with natural aspect ratio for masonry
    const img = document.createElement('img');
    img.src = displayImg;
    img.alt = title;
    img.loading = 'lazy';
    
    const info = document.createElement('div');
    info.className = 'gallery-item-info';
    info.innerHTML = `
      <div class="gallery-item-title">${escapeHtml(title)}</div>
      <div class="gallery-item-meta">${aw.year || ''}${aw.medium ? ' · ' + (l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium) : ''}</div>
    `;
    
    div.appendChild(img);
    div.appendChild(info);
    div.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(div);
  });
}

/* ════════════════════════════════════════════
   LIGHTBOX
════════════════════════════════════════════ */
function openLightbox(idx) {
  currentLightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  currentLightboxIndex += dir;
  if (currentLightboxIndex < 0) currentLightboxIndex = currentArtworks.length - 1;
  if (currentLightboxIndex >= currentArtworks.length) currentLightboxIndex = 0;
  renderLightbox();
}

function renderLightbox() {
  const aw = currentArtworks[currentLightboxIndex];
  if (!aw) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
  const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
  const desc = l === 'tr' ? (aw.descTR || aw.desc) : aw.desc;
  
  const content = document.getElementById('lightbox-content');
  
  // Get main image
  let mainImg = aw.displayImage;
  if (aw.images && aw.images.length) {
    const main = aw.images.find(i => i.isMain);
    mainImg = main ? main.path : aw.images[0].path;
  }
  
  // Check for 3D model in materials
  let modelPath = null;
  if (aw.materials) {
    const modelMat = aw.materials.find(m => m.type === '3d-model' && m.path);
    if (modelMat) modelPath = modelMat.path;
  }
  
  let html = `
    <div class="lightbox-image-wrap">
      <img class="lightbox-image" src="${escapeHtml(mainImg)}" alt="${escapeHtml(title)}">
    </div>
    <div class="lightbox-info">
      <div class="lightbox-title">${escapeHtml(title)}</div>
      <div class="lightbox-meta">
        ${aw.year ? aw.year + '<br>' : ''}
        ${medium || ''}
      </div>
      ${desc ? `<div class="lightbox-desc">${formatDesc(desc)}</div>` : ''}
      ${modelPath ? `<button class="btn-3d" onclick="openViewer('${escapeHtml(modelPath)}')">${l === 'tr' ? '3D Görüntüle' : 'View in 3D'}</button>` : ''}
    </div>
  `;
  
  // Additional images (excluding main)
  if (aw.images && aw.images.length > 1) {
    const additionalImgs = aw.images.filter(img => img.path !== mainImg);
    if (additionalImgs.length > 0) {
      html += '<div class="lightbox-gallery">';
      additionalImgs.forEach(img => {
        html += `<img src="${escapeHtml(img.path)}" alt="${escapeHtml(title)}">`;
      });
      html += '</div>';
    }
  }
  
  // Materials section
  if (aw.materials && aw.materials.length > 0) {
    const visibleMaterials = aw.materials.filter(m => m.type !== '3d-model');
    if (visibleMaterials.length > 0) {
      html += `<div class="lightbox-materials">`;
      
      visibleMaterials.forEach(mat => {
        const label = mat.label || '';
        const matContent = l === 'tr' ? (mat.contentTR || mat.content) : mat.content;
        
        html += `<div class="material-section">`;
        if (label) {
          html += `<div class="material-label">${escapeHtml(label)}</div>`;
        }
        
        if (mat.type === 'image-gallery' && mat.images && mat.images.length > 0) {
          html += '<div class="material-images">';
          mat.images.forEach(img => {
            html += `<img src="${escapeHtml(img.path)}" alt="">`;
          });
          html += '</div>';
        } else if (mat.type === 'text' && matContent) {
          html += `<div class="material-text">${formatDesc(matContent)}</div>`;
        } else if (mat.type === 'video' && mat.path) {
          html += `<video controls style="max-width:100%;"><source src="${escapeHtml(mat.path)}"></video>`;
        }
        
        html += '</div>';
      });
      
      html += '</div>';
    }
  }
  
  content.innerHTML = html;
  
  // Scroll to top when opening new artwork
  document.getElementById('lightbox').scrollTop = 0;
}

function formatDesc(text) {
  return text.split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('');
}

/* ════════════════════════════════════════════
   3D VIEWER
════════════════════════════════════════════ */
let viewer3d = null;

function openViewer(modelPath) {
  document.getElementById('viewer-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  // Initialize Three.js viewer
  setTimeout(() => {
    initViewer(modelPath);
  }, 100);
}

function closeViewer() {
  document.getElementById('viewer-overlay').classList.remove('open');
  document.body.style.overflow = '';
  
  if (viewer3d) {
    cancelAnimationFrame(viewer3d.animId);
    viewer3d.renderer.dispose();
    viewer3d = null;
  }
}

function initViewer(modelPath) {
  const canvas = document.getElementById('viewer3d-canvas');
  const container = canvas.parentElement;
  const W = container.clientWidth;
  const H = container.clientHeight;
  
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f5f5);
  
  // Camera
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
  camera.position.set(0, 1, 3);
  
  // Renderer
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  
  // Controls
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  
  // Lights
  const ambient = new THREE.AmbientLight(0xffffff, 0.6);
  scene.add(ambient);
  const directional = new THREE.DirectionalLight(0xffffff, 0.8);
  directional.position.set(5, 10, 7.5);
  scene.add(directional);
  
  // Load model
  const loader = new THREE.GLTFLoader();
  loader.load(modelPath, gltf => {
    const model = gltf.scene;
    
    // Center and scale
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    const size = box.getSize(new THREE.Vector3());
    model.position.sub(center);
    const maxDim = Math.max(size.x, size.y, size.z);
    model.scale.setScalar(2 / maxDim);
    
    scene.add(model);
  });
  
  // Animate
  function animate() {
    viewer3d.animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  
  viewer3d = { renderer, animId: null };
  animate();
  
  // Handle resize
  window.addEventListener('resize', () => {
    const W = container.clientWidth;
    const H = container.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
}

/* ════════════════════════════════════════════
   LANGUAGE
════════════════════════════════════════════ */
function updateLangTexts() {
  const l = currentLang;
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.dataset.tr) {
      el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
    }
  });
  
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-tr').classList.toggle('active', l === 'tr');
}

/* ════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════ */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildSeriesDropdown();
  buildGallery();
  updateLangTexts();
  
  // Series toggle
  document.getElementById('series-toggle').addEventListener('click', toggleSeries);
  
  // Start with dropdown open
  document.getElementById('series-dropdown').classList.add('open');
  
  // Language buttons
  document.getElementById('btn-en').addEventListener('click', () => {
    setLang('en');
    buildSeriesDropdown();
    buildGallery();
    updateLangTexts();
  });
  
  document.getElementById('btn-tr').addEventListener('click', () => {
    setLang('tr');
    buildSeriesDropdown();
    buildGallery();
    updateLangTexts();
  });
  
  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (document.getElementById('viewer-overlay').classList.contains('open')) {
      if (e.key === 'Escape') closeViewer();
      return;
    }
    if (document.getElementById('lightbox').classList.contains('open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    }
  });
});
  </script>
</body>
</html>
