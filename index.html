<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tarık yiğit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Main Content (Left) -->
    <main class="main-content">
      <div class="gallery-grid" id="gallery"></div>
    </main>

    <!-- Sidebar (Right) -->
    <nav class="sidebar">
      <div class="sidebar-name">
        <a href="index.html">tarık yiğit</a>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" class="active" data-en="artworks" data-tr="eserler">artworks</a>
        <a href="about.html" data-en="about" data-tr="hakkında">about</a>
        <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
        <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
      </div>
      <div class="sidebar-bottom">
        <div class="lang-switch">
          <button id="btn-en" class="active">EN</button>
          <button id="btn-tr">TR</button>
        </div>
      </div>
    </nav>
  </div>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox">
    <button class="lightbox-close" onclick="closeLightbox()">×</button>
    <button class="lightbox-nav lightbox-prev" onclick="navLightbox(-1)">‹</button>
    <button class="lightbox-nav lightbox-next" onclick="navLightbox(1)">›</button>
    <div class="lightbox-content" id="lightbox-content"></div>
  </div>

  <!-- 3D Viewer Scripts -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="viewer3d.js"></script>
  <script>
/* ════════════════════════════════════════════
   GALLERY
════════════════════════════════════════════ */
let currentArtworks = [];
let currentLightboxIndex = 0;

function buildGallery() {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  const l = currentLang;
  
  // Filter out archived
  currentArtworks = (SITE.artworks || []).filter(a => !a.archived);
  
  currentArtworks.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const displayImg = aw.displayImage || (aw.images && aw.images[0] ? aw.images[0].path : null);
    
    if (!displayImg) return;
    
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.innerHTML = `
      <img src="${_esc(displayImg)}" alt="${_esc(title)}">
      <div class="gallery-item-info">
        <div class="gallery-item-title">${_esc(title)}</div>
        <div class="gallery-item-meta">${aw.year || ''}${aw.medium ? ' · ' + (l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium) : ''}</div>
      </div>
    `;
    div.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(div);
  });
}

/* ════════════════════════════════════════════
   LIGHTBOX
════════════════════════════════════════════ */
function openLightbox(idx) {
  currentLightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
  // Clean up 3D viewer if active
  if (window.viewer3d) {
    window.viewer3d.dispose();
    window.viewer3d = null;
  }
}

function navLightbox(dir) {
  currentLightboxIndex += dir;
  if (currentLightboxIndex < 0) currentLightboxIndex = currentArtworks.length - 1;
  if (currentLightboxIndex >= currentArtworks.length) currentLightboxIndex = 0;
  renderLightbox();
}

function renderLightbox() {
  const aw = currentArtworks[currentLightboxIndex];
  if (!aw) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
  const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
  const desc = l === 'tr' ? (aw.descTR || aw.desc) : aw.desc;
  
  const content = document.getElementById('lightbox-content');
  
  // Check if 3D model
  const is3D = aw.workType === '3d' && aw.images && aw.images.some(img => 
    img.path && /\.(glb|gltf|obj|fbx)$/i.test(img.path)
  );
  
  if (is3D) {
    const modelFile = aw.images.find(img => /\.(glb|gltf|obj|fbx)$/i.test(img.path));
    content.innerHTML = `
      <div class="lightbox-image-wrap">
        <div class="viewer3d-container">
          <canvas id="viewer3d-canvas"></canvas>
          <div class="viewer3d-hint" data-en="drag to rotate · scroll to zoom" data-tr="döndürmek için sürükle · yakınlaştırmak için kaydır">drag to rotate · scroll to zoom</div>
        </div>
      </div>
      <div class="lightbox-info">
        <div class="lightbox-title">${_esc(title)}</div>
        <div class="lightbox-meta">
          ${aw.year ? aw.year + '<br>' : ''}
          ${medium || ''}
        </div>
        ${desc ? `<div class="lightbox-desc">${_esc(desc)}</div>` : ''}
      </div>
    `;
    // Initialize 3D viewer
    setTimeout(() => {
      if (window.viewer3d) window.viewer3d.dispose();
      window.viewer3d = new Viewer3D('viewer3d-canvas', modelFile.path);
    }, 100);
  } else {
    // Regular image
    const mainImg = aw.mainImage || (aw.images && aw.images[0] ? aw.images[0].path : aw.displayImage);
    content.innerHTML = `
      <div class="lightbox-image-wrap">
        <img class="lightbox-image" src="${_esc(mainImg)}" alt="${_esc(title)}">
      </div>
      <div class="lightbox-info">
        <div class="lightbox-title">${_esc(title)}</div>
        <div class="lightbox-meta">
          ${aw.year ? aw.year + '<br>' : ''}
          ${medium || ''}
        </div>
        ${desc ? `<div class="lightbox-desc">${_esc(desc)}</div>` : ''}
      </div>
    `;
  }
  
  // Update hint text for current language
  updateLangTexts();
}

/* ════════════════════════════════════════════
   LANGUAGE
════════════════════════════════════════════ */
function updateLangTexts() {
  const l = currentLang;
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  
  // Update active state on lang buttons
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-tr').classList.toggle('active', l === 'tr');
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  buildGallery();
  updateLangTexts();
  
  document.getElementById('btn-en').addEventListener('click', () => {
    setLang('en');
    buildGallery();
    updateLangTexts();
  });
  
  document.getElementById('btn-tr').addEventListener('click', () => {
    setLang('tr');
    buildGallery();
    updateLangTexts();
  });
  
  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    if (e.key === 'ArrowLeft') navLightbox(-1);
    if (e.key === 'ArrowRight') navLightbox(1);
  });
});
  </script>
</body>
</html>
