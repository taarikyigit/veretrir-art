    <!-- Sidebar (Right) -->

  <!-- Lightbox -->

  <!-- Scripts -->

  <script src="data.js"></script>
  <script src="common.js"></script>
  
  <script>
// PDF.js worker
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

/* ════════════════════════════════════════════
   STATE
════════════════════════════════════════════ */
let currentArtworks = [];
let currentLightboxIndex = 0;
let currentSeries = 'all';
let seriesOpen = false;
let simOpen = false;

/* ════════════════════════════════════════════
   HERO SLIDER
════════════════════════════════════════════ */
function buildHeroSlider() {
  const slidesContainer = document.getElementById('hero-slides');
  slidesContainer.innerHTML = '';
  
  let heroImages = [];
  const artworks = (SITE.artworks || []).filter(a => !a.archived);
  const featured = artworks.filter(a => a.featured);
  const pool = featured.length >= 3 ? featured : artworks;
  
  pool.slice(0, 6).forEach(aw => {
    const img = aw.displayImage || (aw.images && aw.images[0] ? aw.images[0].path : null);
    if (img) heroImages.push(img);
  });
  
  if (heroImages.length === 0) {
    enterSite();
    return;
  }
  
  heroImages.forEach((src, i) => {
    const slide = document.createElement('div');
    slide.className = 'hero-slide' + (i === 0 ? ' active' : '');
    slide.style.backgroundImage = `url('${src}')`;
    slidesContainer.appendChild(slide);
  });
  
  let currentSlide = 0;
  setInterval(() => {
    const slides = document.querySelectorAll('.hero-slide');
    if (slides.length === 0) return;
    slides[currentSlide].classList.remove('active');
    currentSlide = (currentSlide + 1) % slides.length;
    slides[currentSlide].classList.add('active');
  }, 4000);
}

function enterSite() {
  const hero = document.getElementById('hero-slider');
  const site = document.getElementById('site-wrapper');
  
  // Smooth slide up animation
  hero.style.transition = 'transform 0.8s ease-in-out, opacity 0.8s ease-in-out';
  hero.style.transform = 'translateY(-100%)';
  hero.style.opacity = '0';
  
  setTimeout(() => {
    hero.style.display = 'none';
    site.classList.add('visible');
    sessionStorage.setItem('entered', '1');
  }, 800);
}

function checkEntered() {
  if (sessionStorage.getItem('entered')) {
    document.getElementById('hero-slider').style.display = 'none';
    document.getElementById('site-wrapper').classList.add('visible');
    return true;
  }
  return false;
}

/* ════════════════════════════════════════════
   DROPDOWNS
════════════════════════════════════════════ */
function buildSeriesDropdown() {
  const dropdown = document.getElementById('series-dropdown');
  const l = currentLang;
  
  let html = `<a href="#" class="sub-link ${currentSeries === 'all' ? 'active' : ''}" data-series="all">${l === 'tr' ? 'tüm eserler' : 'all works'}</a>`;
  
  const series = SITE.series || [];
  series.forEach(s => {
    const name = l === 'tr' ? (s.tr || s.en) : s.en;
    const isActive = currentSeries === s.en;
    html += `<a href="#" class="sub-link ${isActive ? 'active' : ''}" data-series="${s.en}">${name}</a>`;
  });
  
  dropdown.innerHTML = html;
  
  dropdown.querySelectorAll('.sub-link').forEach(link => {
    link.addEventListener('click', e => {
      e.preventDefault();
      currentSeries = link.dataset.series;
      dropdown.querySelectorAll('.sub-link').forEach(l => l.classList.remove('active'));
      link.classList.add('active');
      buildGallery();
    });
  });
}

function toggleDropdown(id, toggleId, stateVar) {
  const dropdown = document.getElementById(id);
  const toggle = document.getElementById(toggleId);
  const isOpen = dropdown.classList.contains('open');
  
  dropdown.classList.toggle('open', !isOpen);
  toggle.classList.toggle('open', !isOpen);
  
  return !isOpen;
}

function updateSimulationLinks() {
  const l = currentLang;
  const simLinks = document.querySelectorAll('#sim-dropdown .sub-link');
  const simNames = [
    { en: 'shadow of the object', tr: 'nesnenin kaplanmış gölgesi' },
    { en: 'life revolves', tr: 'hayat döner' },
    { en: 'trace of gravity', tr: 'yerçekiminin izi' }
  ];
  simLinks.forEach((link, i) => {
    if (simNames[i]) {
      link.textContent = l === 'tr' ? simNames[i].tr : simNames[i].en;
    }
  });
}

/* ════════════════════════════════════════════
   GALLERY
════════════════════════════════════════════ */
function buildGallery() {
  const grid = document.getElementById('gallery');
  grid.innerHTML = '';
  const l = currentLang;
  
  let artworks = (SITE.artworks || []).filter(a => !a.archived);
  
  if (currentSeries !== 'all') {
    artworks = artworks.filter(a => {
      const awSeries = (a.series || '').toLowerCase().trim();
      return awSeries === currentSeries.toLowerCase().trim();
    });
  }
  
  currentArtworks = artworks;
  
  artworks.forEach((aw, idx) => {
    const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
    const displayImg = aw.displayImage || (aw.images && aw.images[0] ? aw.images[0].path : null);
    
    if (!displayImg) return;
    
    const div = document.createElement('div');
    div.className = 'gallery-item';
    div.style.animationDelay = `${idx * 0.06}s`;
    
    const img = document.createElement('img');
    img.src = displayImg;
    img.alt = title;
    img.loading = 'lazy';
    
    const info = document.createElement('div');
    info.className = 'gallery-item-info';
    info.innerHTML = `
      <div class="gallery-item-title">${escapeHtml(title)}</div>
      <div class="gallery-item-meta">${aw.year || ''}${aw.medium ? ' · ' + (l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium) : ''}</div>
    `;
    
    div.appendChild(img);
    div.appendChild(info);
    div.addEventListener('click', () => openLightbox(idx));
    grid.appendChild(div);
  });
}

/* ════════════════════════════════════════════
   LIGHTBOX
════════════════════════════════════════════ */
function openLightbox(idx) {
  currentLightboxIndex = idx;
  renderLightbox();
  document.getElementById('lightbox').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.body.style.overflow = '';
}

function navLightbox(dir) {
  currentLightboxIndex += dir;
  if (currentLightboxIndex < 0) currentLightboxIndex = currentArtworks.length - 1;
  if (currentLightboxIndex >= currentArtworks.length) currentLightboxIndex = 0;
  renderLightbox();
}

function renderLightbox() {
  const aw = currentArtworks[currentLightboxIndex];
  if (!aw) return;
  
  const l = currentLang;
  const title = l === 'tr' ? (aw.titleTR || aw.title) : aw.title;
  const medium = l === 'tr' ? (aw.mediumTR || aw.medium) : aw.medium;
  const desc = l === 'tr' ? (aw.descTR || aw.desc) : aw.desc;
  
  const content = document.getElementById('lightbox-content');
  
  let mainImg = aw.displayImage;
  if (aw.images && aw.images.length) {
    const main = aw.images.find(i => i.isMain);
    mainImg = main ? main.path : aw.images[0].path;
  }
  
  // Find 3D model
  let modelPath = null;
  if (aw.materials) {
    const modelMat = aw.materials.find(m => (m.type === '3d-model' || m.type === '3d') && m.path);
    if (modelMat) modelPath = modelMat.path;
  }
  
  let html = `
    <div class="lightbox-image-wrap">
      <img class="lightbox-image" src="${escapeHtml(mainImg)}" alt="${escapeHtml(title)}">
    </div>
    <div class="lightbox-info">
      <div class="lightbox-title">${escapeHtml(title)}</div>
      <div class="lightbox-meta">${aw.year ? aw.year + '<br>' : ''}${medium || ''}</div>
      ${desc ? `<div class="lightbox-desc">${formatDesc(desc)}</div>` : ''}
      ${modelPath ? `<button class="btn-action" onclick="openViewer('${escapeHtml(modelPath)}')">${l === 'tr' ? '3D Görüntüle' : 'View in 3D'}</button>` : ''}
    </div>
  `;
  
  // Additional images
  if (aw.images && aw.images.length > 1) {
    const additionalImgs = aw.images.filter(img => img.path !== mainImg);
    if (additionalImgs.length > 0) {
      html += '<div class="lightbox-gallery">';
      additionalImgs.forEach(img => {
        html += `<img src="${escapeHtml(img.path)}" alt="${escapeHtml(title)}">`;
      });
      html += '</div>';
    }
  }
  
  // Materials
  if (aw.materials && aw.materials.length > 0) {
    html += `<div class="lightbox-materials">`;
    
    aw.materials.forEach(mat => {
      const label = mat.label || '';
      const matContent = l === 'tr' ? (mat.contentTR || mat.content) : mat.content;
      
      html += `<div class="material-section">`;
      if (label) html += `<div class="material-label">${escapeHtml(label)}</div>`;
      
      if (mat.type === 'gif' && mat.images && mat.images.length > 0) {
        html += '<div class="material-media">';
        mat.images.forEach(img => {
          html += `<img src="${escapeHtml(img.path)}" alt="GIF">`;
        });
        html += '</div>';
      }
      else if (mat.type === 'image-gallery' && mat.images && mat.images.length > 0) {
        html += '<div class="material-images">';
        mat.images.forEach(img => {
          html += `<img src="${escapeHtml(img.path)}" alt="">`;
        });
        html += '</div>';
      }
      else if (mat.type === 'text' && matContent) {
        html += `<div class="material-text">${formatDesc(matContent)}</div>`;
      }
      else if (mat.type === 'video' && mat.path) {
        html += `<video controls style="max-width:100%;"><source src="${escapeHtml(mat.path)}"></video>`;
      }
      else if (mat.type === 'pdf' && mat.path) {
        html += `<button class="btn-action" onclick="openPdfViewer('${escapeHtml(mat.path)}')">${l === 'tr' ? 'PDF Görüntüle' : 'View PDF'}</button>`;
      }
      else if ((mat.type === '3d' || mat.type === '3d-model') && mat.path) {
        html += `<button class="btn-action" onclick="openViewer('${escapeHtml(mat.path)}')">${l === 'tr' ? '3D Görüntüle' : 'View in 3D'}</button>`;
      }
      
      html += '</div>';
    });
    
    html += '</div>';
  }
  
  content.innerHTML = html;
  document.getElementById('lightbox').scrollTop = 0;
}

function formatDesc(text) {
  if (!text) return '';
  return text.split('\n\n').map(p => `<p>${escapeHtml(p)}</p>`).join('');
}

/* ════════════════════════════════════════════
   3D VIEWER (Three.js)
════════════════════════════════════════════ */
let viewer3d = null;

function openViewer(modelPath) {
  console.log('Opening 3D viewer for:', modelPath);
  document.getElementById('viewer-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  setTimeout(() => {
    initViewer(modelPath);
  }, 100);
}

function closeViewer() {
  document.getElementById('viewer-overlay').classList.remove('open');
  document.body.style.overflow = '';
  
  if (viewer3d) {
    if (viewer3d.animId) cancelAnimationFrame(viewer3d.animId);
    if (viewer3d.renderer) viewer3d.renderer.dispose();
    if (viewer3d.controls) viewer3d.controls.dispose();
    document.getElementById('viewer-container').innerHTML = '';
    viewer3d = null;
  }
}

function initViewer(modelPath) {
  const container = document.getElementById('viewer-container');
  container.innerHTML = '';
  
  const W = container.clientWidth || 800;
  const H = container.clientHeight || 500;
  
  console.log('Init viewer:', W, 'x', H);
  
  // Scene
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf0f0f0);
  
  // Camera
  const camera = new THREE.PerspectiveCamera(45, W / H, 0.1, 1000);
  camera.position.set(0, 1.5, 4);
  
  // Renderer
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  container.appendChild(renderer.domElement);
  
  // Controls
  const controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.target.set(0, 0, 0);
  
  // Lights
  scene.add(new THREE.AmbientLight(0xffffff, 0.7));
  const directional = new THREE.DirectionalLight(0xffffff, 0.8);
  directional.position.set(5, 10, 7.5);
  scene.add(directional);
  const backLight = new THREE.DirectionalLight(0xffffff, 0.3);
  backLight.position.set(-5, 5, -5);
  scene.add(backLight);
  
  // Load model
  const loader = new THREE.GLTFLoader();
  loader.load(
    modelPath,
    function(gltf) {
      console.log('Model loaded:', gltf);
      const model = gltf.scene;
      
      // Center and scale
      const box = new THREE.Box3().setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      const size = box.getSize(new THREE.Vector3());
      model.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = 2.5 / maxDim;
      model.scale.setScalar(scale);
      
      scene.add(model);
      controls.update();
    },
    function(xhr) {
      console.log('Loading: ' + (xhr.loaded / xhr.total * 100) + '%');
    },
    function(error) {
      console.error('3D Model load error:', error);
      alert('3D model yüklenemedi / Could not load 3D model');
    }
  );
  
  // Animation loop
  function animate() {
    viewer3d.animId = requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  }
  
  viewer3d = { renderer, controls, animId: null };
  animate();
  
  // Resize handler
  window.addEventListener('resize', () => {
    const W = container.clientWidth;
    const H = container.clientHeight;
    camera.aspect = W / H;
    camera.updateProjectionMatrix();
    renderer.setSize(W, H);
  });
}

/* ════════════════════════════════════════════
   PDF VIEWER
════════════════════════════════════════════ */
let pdfDoc = null;
let pdfPage = 1;
let pdfTotalPages = 1;
let pdfScale = 1.5;

function openPdfViewer(pdfPath) {
  document.getElementById('pdf-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
  
  pdfjsLib.getDocument(pdfPath).promise.then(pdf => {
    pdfDoc = pdf;
    pdfTotalPages = pdf.numPages;
    pdfPage = 1;
    renderPdfPage();
  }).catch(err => {
    console.error('PDF load error:', err);
    alert('PDF yüklenemedi / Could not load PDF');
    closePdfViewer();
  });
}

function renderPdfPage() {
  if (!pdfDoc) return;
  
  pdfDoc.getPage(pdfPage).then(page => {
    const canvas = document.getElementById('pdf-canvas');
    const ctx = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: pdfScale });
    
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    
    page.render({ canvasContext: ctx, viewport: viewport });
    
    document.getElementById('pdf-page-info').textContent = `${pdfPage} / ${pdfTotalPages}`;
    document.getElementById('pdf-zoom-info').textContent = Math.round(pdfScale * 100 / 1.5) + '%';
  });
}

function pdfNav(dir) {
  pdfPage += dir;
  if (pdfPage < 1) pdfPage = 1;
  if (pdfPage > pdfTotalPages) pdfPage = pdfTotalPages;
  renderPdfPage();
}

function pdfZoom(dir) {
  pdfScale += dir * 0.25;
  if (pdfScale < 0.5) pdfScale = 0.5;
  if (pdfScale > 4) pdfScale = 4;
  renderPdfPage();
}

function closePdfViewer() {
  document.getElementById('pdf-overlay').classList.remove('open');
  document.body.style.overflow = '';
  pdfDoc = null;
}

/* ════════════════════════════════════════════
   LANGUAGE
════════════════════════════════════════════ */
function updateLangTexts() {
  const l = currentLang;
  document.querySelectorAll('[data-en]').forEach(el => {
    if (el.dataset.tr) {
      el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
    }
  });
  
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-tr').classList.toggle('active', l === 'tr');
  
  updateSimulationLinks();
}

/* ════════════════════════════════════════════
   UTILITIES
════════════════════════════════════════════ */
function escapeHtml(str) {
  if (!str) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

/* ════════════════════════════════════════════
   INIT
════════════════════════════════════════════ */
document.addEventListener('DOMContentLoaded', () => {
  // Check if already entered
  if (!checkEntered()) {
    buildHeroSlider();
  }
  
  // Hero enter button
  document.getElementById('hero-enter').addEventListener('click', enterSite);
  
  buildSeriesDropdown();
  buildGallery();
  updateLangTexts();
  
  // Series toggle (closed by default)
  document.getElementById('series-toggle').addEventListener('click', () => {
    seriesOpen = toggleDropdown('series-dropdown', 'series-toggle', seriesOpen);
  });
  
  // Simulations toggle (closed by default)
  document.getElementById('sim-toggle').addEventListener('click', () => {
    simOpen = toggleDropdown('sim-dropdown', 'sim-toggle', simOpen);
  });
  
  // Language buttons
  document.getElementById('btn-en').addEventListener('click', () => {
    setLang('en');
    buildSeriesDropdown();
    buildGallery();
    updateLangTexts();
  });
  
  document.getElementById('btn-tr').addEventListener('click', () => {
    setLang('tr');
    buildSeriesDropdown();
    buildGallery();
    updateLangTexts();
  });
  
  // Keyboard navigation
  document.addEventListener('keydown', e => {
    if (document.getElementById('pdf-overlay').classList.contains('open')) {
      if (e.key === 'Escape') closePdfViewer();
      if (e.key === 'ArrowLeft') pdfNav(-1);
      if (e.key === 'ArrowRight') pdfNav(1);
      return;
    }
    if (document.getElementById('viewer-overlay').classList.contains('open')) {
      if (e.key === 'Escape') closeViewer();
      return;
    }
    if (document.getElementById('lightbox').classList.contains('open')) {
      if (e.key === 'Escape') closeLightbox();
      if (e.key === 'ArrowLeft') navLightbox(-1);
      if (e.key === 'ArrowRight') navLightbox(1);
    }
  });
});
  </script>
