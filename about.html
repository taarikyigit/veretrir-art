<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about — tarık yiğit</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="site-layout">
  <!-- Main Content -->
  <main class="site-content">
    <div class="about-content">
      <img class="about-photo" id="about-photo" src="" alt="" style="display:none;">
      <div class="about-text" id="about-text"></div>
    </div>
  </main>

  <!-- Right Sidebar -->
  <aside class="site-sidebar">
    <div class="sidebar-name">
      <a href="index.html">tarık yiğit</a>
    </div>
    
    <nav class="sidebar-nav">
      <a href="index.html" class="sidebar-link" data-en="artworks" data-tr="eserler">artworks</a>
      <a href="about.html" class="sidebar-link active" data-en="about" data-tr="hakkında">about</a>
      <a href="writings.html" class="sidebar-link" data-en="writings" data-tr="yazılar">writings</a>
      <a href="contact.html" class="sidebar-link" data-en="contact" data-tr="iletişim">contact</a>
    </nav>
    
    <div class="sidebar-spacer"></div>
    
    <div class="sidebar-lang">
      <button id="b-en" class="on">EN</button>
      <span>/</span>
      <button id="b-tr">TR</button>
    </div>
  </aside>
</div>

<script src="data.js"></script>
<script>
let currentLang = localStorage.getItem('lang') || 'tr';

function updateLang() {
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = currentLang === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('b-en').classList.toggle('on', currentLang === 'en');
  document.getElementById('b-tr').classList.toggle('on', currentLang === 'tr');
  localStorage.setItem('lang', currentLang);
}

function buildAbout() {
  const l = currentLang;
  const texts = SITE.texts || {};
  
  // Photo
  const photoEl = document.getElementById('about-photo');
  if (texts.profilePhoto) {
    photoEl.src = texts.profilePhoto;
    photoEl.style.display = '';
  } else {
    photoEl.style.display = 'none';
  }
  
  // Text
  const aboutText = l === 'tr' ? (texts.aboutTR || texts.aboutEN || '') : (texts.aboutEN || '');
  const paras = aboutText.split(/\n\n+/).map(p => `<p>${p}</p>`).join('');
  document.getElementById('about-text').innerHTML = paras;
}

document.addEventListener('DOMContentLoaded', () => {
  updateLang();
  buildAbout();
  
  document.getElementById('b-en').addEventListener('click', () => {
    currentLang = 'en';
    updateLang();
    buildAbout();
  });
  
  document.getElementById('b-tr').addEventListener('click', () => {
    currentLang = 'tr';
    updateLang();
    buildAbout();
  });
});
</script>

</body>
</html>
