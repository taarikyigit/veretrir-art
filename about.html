<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>about — tarık yiğit</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="site-wrapper">
    <!-- Main Content -->
    <main class="main-content">
      <div class="about-content">
        <img class="about-photo" id="about-photo" src="" alt="" style="display:none;">
        <div class="about-text" id="about-text"></div>
      </div>
    </main>

    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-name">
        <a href="index.html">tarık yiğit</a>
      </div>
      <div class="sidebar-nav">
        <a href="index.html" data-en="artworks" data-tr="eserler">artworks</a>
        <a href="about.html" class="active" data-en="about" data-tr="hakkında">about</a>
        <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
        <div class="nav-item-group">
          <a href="#" class="nav-main" onclick="return false;" data-en="simulations" data-tr="simülasyonlar">simulations</a>
        </div>
        <div class="series-dropdown sim-dropdown">
          <a href="simulations/kaplanmis_golgesi.html" target="_blank" class="series-link">shadow of the object</a>
          <a href="simulations/hayat_doner.html" target="_blank" class="series-link">life revolves</a>
          <a href="simulations/yercekiminin_izi.html" target="_blank" class="series-link">trace of gravity</a>
        </div>
        <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
      </div>
      <div class="sidebar-bottom">
        <div class="lang-switch">
          <button id="btn-en" class="active">EN</button>
          <button id="btn-tr">TR</button>
        </div>
      </div>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script>
function buildAbout() {
  const l = currentLang;
  const texts = SITE.texts || {};
  
  // Photo
  const photo = document.getElementById('about-photo');
  if (texts.profilePhoto) {
    photo.src = texts.profilePhoto;
    photo.style.display = '';
  } else {
    photo.style.display = 'none';
  }
  
  // Text
  const aboutText = l === 'tr' ? (texts.aboutTR || texts.aboutEN || '') : (texts.aboutEN || '');
  const textEl = document.getElementById('about-text');
  textEl.innerHTML = aboutText.split('\n\n').map(p => `<p>${_esc(p)}</p>`).join('');
}

function updateLangTexts() {
  const l = currentLang;
  document.querySelectorAll('[data-en]').forEach(el => {
    el.textContent = l === 'tr' ? el.dataset.tr : el.dataset.en;
  });
  document.getElementById('btn-en').classList.toggle('active', l === 'en');
  document.getElementById('btn-tr').classList.toggle('active', l === 'tr');
  
  // Update simulation links
  const simLinks = document.querySelectorAll('.sim-dropdown .series-link');
  const simNames = [
    { en: 'shadow of the object', tr: 'nesnenin kaplanmış gölgesi' },
    { en: 'life revolves', tr: 'hayat döner' },
    { en: 'trace of gravity', tr: 'yerçekiminin izi' }
  ];
  simLinks.forEach((link, i) => {
    if (simNames[i]) {
      link.textContent = l === 'tr' ? simNames[i].tr : simNames[i].en;
    }
  });
}

document.addEventListener('DOMContentLoaded', () => {
  buildAbout();
  updateLangTexts();
  
  document.getElementById('btn-en').addEventListener('click', () => {
    setLang('en');
    buildAbout();
    updateLangTexts();
  });
  
  document.getElementById('btn-tr').addEventListener('click', () => {
    setLang('tr');
    buildAbout();
    updateLangTexts();
  });
});
  </script>
</body>
</html>
