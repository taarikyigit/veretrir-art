<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>about — tarık yiğit</title>
<link rel="stylesheet" href="style.css"/>
<style>
.about-text {
  max-width: 560px;
  font-size: 14px;
  line-height: 2.0;
  color: #444;
}
.about-text p + p { margin-top: 16px; }
</style>
</head>
<body>
<div id="page-transition-mask"></div>
<header>
  <div class="header-left">
    <a href="index.html" class="header-name">tarık yiğit</a>
    <a href="https://instagram.com/veretrir" target="_blank" rel="noopener" class="ig-btn" title="Instagram" data-no-transition>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/><circle cx="12" cy="12" r="4"/>
        <circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/>
      </svg>
    </a>
  </div>
  <nav>
    <a href="artworks.html" data-en="artworks" data-tr="eserler">artworks</a>
    <a href="writings.html" data-en="writings" data-tr="yazılar">writings</a>
    <a href="about.html" data-en="about" data-tr="hakkında" class="active">about</a>
    <a href="contact.html" data-en="contact" data-tr="iletişim">contact</a>
  </nav>
  <div class="header-right">
    <button class="lb on" id="b-en" onclick="setLang('en')">en</button>
    <span class="lang-sep">·</span>
    <button class="lb" id="b-tr" onclick="setLang('tr')">tr</button>
  </div>
</header>
<div class="page-wrap">
  <div class="sec">
    <div class="sec-title reveal" data-en="about" data-tr="hakkında">about</div>
    <div class="about-text reveal reveal-delay-1" id="aboutText"></div>
  </div>
</div>
<footer><span>tarık yiğit</span><span>veretrir.art</span></footer>
<script src="data.js"></script><script src="common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  function renderAbout() {
    const l = currentLang;
    const txt = (SITE.texts || {});
    const raw = l === 'tr' ? (txt.aboutTR || txt.aboutEN || '') : (txt.aboutEN || '');
    const el = document.getElementById('aboutText');
    if (!el) return;
    el.innerHTML = raw.split(/\n\n+/)
      .filter(p => p.trim())
      .map(p => `<p>${p.replace(/\n/g,'<br>')}</p>`)
      .join('');
  }
  renderAbout();
  document.getElementById('b-en').addEventListener('click', renderAbout);
  document.getElementById('b-tr').addEventListener('click', renderAbout);
  
  // Trigger reveal animations
  setTimeout(() => {
    document.querySelectorAll('.reveal').forEach(el => el.classList.add('active'));
  }, 100);
});
</script>
</body>
</html>
